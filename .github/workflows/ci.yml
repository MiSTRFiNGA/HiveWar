name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  web-sanity:
    name: Web sanity (syntax + build + qa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: JS syntax check (inline scripts in index.html)
        run: node scripts/check_index_syntax.mjs index.html

      - name: Build portal bundles
        run: python build.py

      - name: Packaging QA
        run: python -m unittest discover -s qa -p 'test_*.py' -v

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-zips
          path: dist/**
          if-no-files-found: warn
