<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>HiVE SWARM</title>
<style>
  html,body{margin:0;padding:0;background:#07030f;overflow:hidden;touch-action:none;
    font-family:'Segoe UI',system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  #game{display:block;margin:0 auto;background:#0a0518}
  #hud{position:fixed;top:8px;left:50%;transform:translateX(-50%);color:#9ff;white-space:nowrap;
    font-weight:900;font-size:36px;pointer-events:none;z-index:5}
  #hud .squad{color:#9ff;text-shadow:0 0 4px #0ff,0 0 12px #0ff,0 0 22px #0ff}
  #hud .lvl  {color:#c46bff;text-shadow:0 0 4px #a03bff,0 0 12px #a03bff,0 0 22px #7a1bff}
  #hud .cash {color:#4dff86;text-shadow:0 0 4px #17d94f,0 0 12px #17d94f,0 0 22px #0a9e33}
  #hud .sep  {opacity:.35}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<script>
'use strict';
// ============================================================ HiVE SWARM M0
// Single-file core. Canvas2D + strict pooling. Vector art placeholder pass
// (sprites land in M1). Conventions: ?test=1 bot, window.__dbg().
// ============================================================

const CFG = {
  W: 540, H: 960,                 // logical portrait playfield
  laneMargin: 60,
  scrollSpd: 170,                 // px/s world scroll
  squadCapVisible: 5,
  squadMax: 300,                  // hard cap — big-army feel; meta upgrades actually stack toward it
  gateAddMax: 999,                // gate value grows as high as you shoot it (capped by per-level plusCap)
  bloodColor: 'green',            // 'green' | 'red' (red hidden from UI; xenos always green)
  levelSeconds: 100,
  levels: 10,
};

// ---------- canvas / scaling ----------
const cv = document.getElementById('game'), cx = cv.getContext('2d');
let scale = 1;
function fit() {
  const a = innerWidth / innerHeight, ga = CFG.W / CFG.H;
  if (a > ga) { cv.height = innerHeight; cv.width = innerHeight * ga; }
  else { cv.width = innerWidth; cv.height = innerWidth / ga; }
  scale = cv.width / CFG.W;
}
addEventListener('resize', fit); fit();

// ---------- seeded rng ----------
let seed = 1234567;
function rng() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
function rr(a, b) { return a + rng() * (b - a); }

// ---------- pools ----------
function makePool(n, factory) {
  const items = new Array(n), free = new Array(n);
  for (let i = 0; i < n; i++) { items[i] = factory(); items[i]._pi = i; free[i] = n - 1 - i; }
  let top = n;
  return {
    items,
    alloc() { if (!top) return null; const it = items[free[--top]]; it.live = true; return it; },
    release(it) { if (!it.live) return; it.live = false; free[top++] = it._pi; },
    each(fn) { for (let i = 0; i < n; i++) if (items[i].live) fn(items[i]); },
    count() { return n - top; }
  };
}
const bullets  = makePool(1800,  () => ({x:0,y:0,vx:0,vy:0,dmg:1,r:3,tier:0,aoe:0,vis:false,grenade:false,live:false}));
const enemies  = makePool(1600, () => ({x:0,y:0,vx:0,vy:0,hp:1,maxhp:1,r:10,kind:0,t:0,
  baseX:0,phase:0,mode:0,laserMark:0,live:false}));
const splats   = makePool(1400, () => ({x:0,y:0,vx:0,vy:0,r:2,a:1,red:false,spark:false,fade:1.4,_col:null,live:false}));
const dmgnums  = makePool(120,  () => ({x:0,y:0,v:0,val:0,a:1,live:false}));
const pickups  = makePool(200,  () => ({x:0,y:0,kind:0,live:false}));   // 0 biomatter 1 chip
const gates    = [];                                                     // few at a time; plain array

// ---------- game state ----------
const G = {
  state: 'title',          // title | play | perk | boss | shop | win | dead
  level: 1, t: 0, levelT: 0,
  squad: 10, weapon: 0,    // weapon tier 0..4
  px: CFG.W / 2,           // squad leader x
  credits: 0, bio: 0, bioNeed: 25,
  kills: 0, shake: 0, streak:0, streakT:0, streakPeak:0, streakAward:0, chipHeal:0, shieldT:0, shieldHits:0,
  perks: {},               // name -> stacks
  droneT: 0, orbitalT: 0, laserT: 0, laserX: 0, laserSeq: 0,
  hitStop:0, flashT:0, graceT:0, squadFlash:0, bossKillT:0, vehicleT:0, vehicleCD:4, vehicleFire:0,
  mode:'campaign', loop:0, runStart:0, maxSquad:10, runBosses:0, creditsStart:0, reviveUsed:false,
  boss: null,
  meta: load(),
};
// Weapon DPS ratios follow balance/balance.json dpsMult [1,1.55,2.3,3.4,5]
const WEAPONS = [
  {name:'Blaster',     rof: 4.5, dmg: 2.0, n:1, spread:0,  col:'#5ef'},   // slow single shots until powerups
  {name:'Twin Plasma', rof:10, dmg: 0.62, n:2, spread:0.06, col:'#4cf'},
  {name:'Scatter Rail',rof:12, dmg: 0.38, n:4, spread:0.22, col:'#c6f'},
  {name:'Heavy Plasma',rof:11, dmg: 0.82, n:3, spread:0.10, col:'#f80'},
  {name:'Orbital Link',rof: 9, dmg: 0.89, n:5, spread:0.18, col:'#ff4'},
];
// ---- Grok balance tables (balance/balance.json v1.0, R1) ----
const BAL = {
  spawnRate: [3,4,6,9,13,18,25,35,47,62],               // early halved again; ramps up per level (+ within-level ramp)
  waveSec:   [70,74,78,82,86,90,94,98,102,55],
  mixEld:    [10,12,15,18,22,25,28,30,32,33],           // % eldritch
  mixCyb:    [0,3,7,12,16,20,22,25,26,27],              // % cyber-mutant
  hp: { bio: L => 8 + 2.0*L, eld: L => 38 + 9.5*L, cyb: L => 20 + 4.5*L },   // R2
  bossHp:    [4400,6800,10000,14400,20000,27000,32000,42000,56000,0],          // Praetorian HP doubled
  queen:     { p1:28000, p2:36000, p3:22000, eggInt:1.8, eggHp:120, hatch:6 },
  gates: {
    interval: L => Math.max(12.0, 18.0 - 0.4*(L-1)),  // RARE reward — a gate is an event, not a metronome
    // Eric growth pass: +1..5 at L1, big negatives, slow shoot-to-upgrade
    plus:  [[1,5],[2,8],[4,12],[6,16],[8,22],[10,28],[13,34],[16,42],[20,52],[24,64]],
    plusCap: [8,14,22,32,45,60,80,105,135,170],
    minus: [[-15,-6],[-20,-9],[-26,-12],[-33,-15],[-40,-18],[-48,-22],[-56,-26],[-65,-30],[-75,-35],[-85,-40]],
    mult:  [[1.1,1.3],[1.2,1.4],[1.2,1.5],[1.3,1.6],[1.4,1.7],[1.4,1.8],[1.5,1.9],[1.6,2.0],[1.7,2.2],[1.8,2.4]],
    multCap: [1.5,1.6,1.8,2.0,2.2,2.4,2.6,2.8,3.0,3.2],
    hpStepPlus: L => Math.round(4 + 1*(L-1)),    // low threshold — the gate number climbs as fast as bullets hit it
    hpStepMult: L => Math.round(6 + 1*(L-1)),
    hpStepWpn:  L => Math.round(10 + 2*(L-1)),
    stepDelta:  L => L <= 3 ? 1 : L <= 7 ? 2 : 3,
  },
  eco: { kill: [1,4,3,6,6], boss: L => 40 + 25*L, level: L => 80 + 40*L, queen: 2500 },
  perks: { maxRank: 3, baseKinds: 3, maxExtraSlots: 2 },
  ads: { headStart: [12,20,28], reviveFrac:.5, reviveMin:20 },
  start: { squad: 5, weapon: 0 },
};
const PERKS = ['Chain Lightning','Drone Escort','Orbital Laser','Acid Rounds','Magnet','Overclock','Shield Matrix'];
// index into the perk_icons.png strip for each perk (undefined = no art, falls back to text only)
const PERK_ICON = {'Chain Lightning':0,'Shield Matrix':1,'Orbital Laser':2,'Acid Rounds':3,'Drone Escort':4};
const EKIND = [ // r values set from Eric's scale-reference sheet (2026-07-16)
  {hp:2,  r:22, spd:70,  col:'#3f6', credits:1},    // 0 Xenoid
  {hp:26, r:24, spd:26,  col:'#a3e', credits:4},    // 1 Eldritch Sponge — 2x bigger
  {hp:7,  r:32, spd:44,  col:'#f55', credits:3},    // 2 Cyber-Mutant — large hulk
  {hp:12, r:18, spd:105, col:'#5ff', credits:6},    // 3 Xenoptera
  {hp:20, r:13, spd:38,  col:'#fb5', credits:6},    // 4 Subterra — small
  {hp:55, r:28, spd:30,  col:'#c6f', credits:14},   // 5 Cephalo-Psychoid command node (bigger)
];
// Bestiary / field-guide: unlocked when first killed. tip = a real tactical secret.
const CODEX = [
  {name:'Biomorph Swarmer', cls:'Fodder Tier', tip:'Weak alone, lethal in numbers — a solid wall of them will overrun a thin squad. Widen your fire, do not tunnel on one lane.'},
  {name:'Eldritch Sponge',  cls:'Bulwark Tier', tip:'Huge health pool, slow. Acid Rounds shred it over time — tag it early and let the corrosion work while you handle the swarm.'},
  {name:'Cyber-Mutant',     cls:'Hazard Tier', tip:'Detonates on death in an AoE. In a tight cluster they chain-explode — bait the first one and let the cluster wipe itself.'},
  {name:'Xenoptera',        cls:'Skirmisher Tier', tip:'Winged xenoid — fast, erratic swoops with a green core. Do not chase; hold your lane and let it cross your fire stream.'},
  {name:'Burrower',         cls:'Ambush Tier', tip:'Erupts from beneath the squad. Watch for the ground tell and slide off the mark before it surfaces.'},
  {name:'Cephalo-Psychoid', cls:'Command Node', tip:'A coordination node — its psychic aura makes every nearby xeno surge faster. KILL IT FIRST and the swarm around it slows right back down.'},
];

// ============================================================
// HiVE FORGE — live-tunable overrides (edited by the GAME EDITOR window, F2)
// Every gameplay number the editor exposes lives here; the game reads EDIT.*
// so Eric can tweak + test without touching code. Persisted per-browser.
// ============================================================
const EDIT_KEY = 'hiveswarm_forge_v1';
function editDefaults() { return {
  player: { rofMul: 1, dmgMul: 1, armor: 0 },   // armor = % of squad-loss prevented (0-90)
  // per-enemy: HP = hpBase + hpLvl × level (per-level scaling), spd/r/credits,
  // weight = relative spawn share (% shown live in the editor), minLvl = first level it appears
  kinds: [
    { name:'Xenoid',        hpBase:8,  hpLvl:2.0, spd:70,  r:22, credits:1,  weight:60,  minLvl:1 },
    { name:'Eldritch Sponge',hpBase:38, hpLvl:9.5, spd:26,  r:24, credits:4,  weight:20,  minLvl:1 },
    { name:'Cyber-Mutant',  hpBase:20, hpLvl:4.5, spd:44,  r:32, credits:3,  weight:12,  minLvl:2 },
    { name:'Xenoptera',     hpBase:30, hpLvl:7,   spd:105, r:18, credits:6,  weight:4.5, minLvl:4 },
    { name:'Subterra',      hpBase:45, hpLvl:10,  spd:38,  r:13, credits:6,  weight:2.5, minLvl:6 },
    { name:'Psychoid',      hpBase:40, hpLvl:14,  spd:30,  r:28, credits:14, weight:1,   minLvl:3 },
  ],
  weapons: WEAPONS.map(w => ({ name:w.name, rof:w.rof, dmg:w.dmg, n:w.n, spread:w.spread })),
  spawnRate: BAL.spawnRate.slice(),
  bossHp: BAL.bossHp.slice(),
  queen: Object.assign({}, BAL.queen),
  bossY: 560,                                    // how far down the boss descends (bigger = closer to player)
  gateInterval: Array.from({length:10}, (_,i) => Math.max(12, 18 - 0.4*i)),   // sec between barrier pairs, per level
  env: Array.from({length:10}, (_,i) => ({      // per-level theming; art drops into assets/env/L<n>_*.png
    name: i === 0 ? 'City Streets' : i === 9 ? 'Inside the Hive' : 'Sector ' + (i+1) })),
  rollers: { interval: 8, pctArmored: 35, hp: 26, hpLvl: 6, speed: 250, size: 46, dmg: 4, minLvl: 2 },
}; }
function mergeEdit(base, saved) {                // deep-ish merge so new fields appear after updates
  for (const k in saved) {
    if (Array.isArray(base[k]) && Array.isArray(saved[k]))
      base[k] = base[k].map((v, i) => (typeof v === 'object' && v ? Object.assign({}, v, saved[k][i] || {}) : (saved[k][i] !== undefined ? saved[k][i] : v)));
    else if (typeof base[k] === 'object' && base[k] && typeof saved[k] === 'object') Object.assign(base[k], saved[k]);
    else base[k] = saved[k];
  }
  return base;
}
let EDIT = (() => { try { return mergeEdit(editDefaults(), JSON.parse(localStorage.getItem(EDIT_KEY) || '{}')); }
                    catch (e) { return editDefaults(); } })();
function saveEdit() { try { localStorage.setItem(EDIT_KEY, JSON.stringify(EDIT)); } catch (e) {} }
function applyEditWeapons() {                    // WEAPONS is read all over — mutate it in place
  EDIT.weapons.forEach((w, i) => { if (WEAPONS[i]) { WEAPONS[i].rof = w.rof; WEAPONS[i].dmg = w.dmg; WEAPONS[i].n = w.n; WEAPONS[i].spread = w.spread; } });
}
applyEditWeapons();
function pickKind(lvl) {                          // weighted spawn pick from editor weights (minLvl-gated)
  let tot = 0; for (let k = 0; k < 6; k++) if (lvl >= EDIT.kinds[k].minLvl) tot += EDIT.kinds[k].weight;
  if (tot <= 0) return 0;
  let r = rng() * tot;
  for (let k = 0; k < 6; k++) { if (lvl < EDIT.kinds[k].minLvl) continue; r -= EDIT.kinds[k].weight; if (r <= 0) return k; }
  return 0;
}
function kindHp(k, lvl) { return Math.max(1, EDIT.kinds[k].hpBase + EDIT.kinds[k].hpLvl * lvl); }

function load() {
  try { return Object.assign({dmg:0,squad:0,weapon:0,credits:0,perkSlot:0,vehicleDrop:0,endless:false,bestScore:0,sfx:true},
    JSON.parse(localStorage.getItem('hiveswarm_v1') || '{}')); }
  catch(e) { return {dmg:0,squad:0,weapon:0,credits:0,perkSlot:0,vehicleDrop:0,endless:false,bestScore:0,sfx:true}; }
}
function save() {
  G.meta.credits = G.credits;
  try { localStorage.setItem('hiveswarm_v1', JSON.stringify(G.meta)); } catch(e) {}
}

// ---------- input ----------
let dragX = null, testBot = /[?&]test=1/.test(location.search), debugCanvas=/[?&]dbg=1/.test(location.search);
function px2game(e) { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / scale; }
function py2game(e) { const r=cv.getBoundingClientRect(); return (e.clientY-r.top)/scale; }
function down(e) {
  // clicks on the FORGE editor window / ⚒ button are UI, not gameplay — never let them
  // start a run from the title screen or steer the squad mid-game
  if (e.target && e.target.closest && e.target.closest('#forge,#forgeBtn')) return;
  botOff(e); const p=e.touches?e.touches[0]:e; dragX=px2game(p); const gy=py2game(p);
  if (dragX>CFG.W-65&&gy<70) { G.meta.sfx=!G.meta.sfx; AUDIO.setMuted(!G.meta.sfx); save(); return; }
  if (G.state === 'title') {
    if (gy > 740 && gy < 800) { G.state = 'codex'; G.codexPage = 0; return; }   // BESTIARY button
    if (G.meta.endless && gy > 610 && gy < 700) startRun('endless'); else startRun('campaign');
  }
  else if (G.state === 'codex') {
    if (gy < 70) { G.state = 'title'; return; }                                 // back
    const unlocked = CODEX.map((c,i)=>i).filter(i => G.meta.codex && G.meta.codex[i]);
    if (unlocked.length) { if (dragX < CFG.W/2) G.codexPage = (G.codexPage + unlocked.length - 1) % unlocked.length;
                           else G.codexPage = (G.codexPage + 1) % unlocked.length; }
  }
  else if (G.state === 'perk') pickPerk(px2game(e.touches ? e.touches[0] : e), (e.touches?e.touches[0].clientY:e.clientY));
  else if (G.state === 'shop') shopTap(e);
  else if (G.state === 'dead'&&gy>610&&gy<720) attemptRevive();
  else if (G.state === 'win' || G.state === 'dead') { G.state = 'title'; }
}
function move(e) { if (dragX === null) return; const x = px2game(e.touches ? e.touches[0] : e);
  if (G.state === 'play' || G.state === 'boss') G.px = Math.max(CFG.laneMargin, Math.min(CFG.W - CFG.laneMargin, x));
}
function up() { dragX = null; }
function botOff(e) { if (testBot && e.isTrusted) testBot = false; }
addEventListener('mousedown', down); addEventListener('mousemove', move); addEventListener('mouseup', up);
addEventListener('touchstart', down, {passive:true}); addEventListener('touchmove', move, {passive:true});
addEventListener('touchend', up);
addEventListener('keydown', e => { if (e.key === 'Escape' && G.state === 'codex') G.state = 'title'; });

// ---------- audio (pooled channel stub; real samples land in the audio pass) ----------
const AUDIO = (() => {
  let ctx = null, muted = false, cursor = 0;
  const channels = new Array(8).fill(null);
  const tones = { gate:520, perk:700, elite:180, boss:95, laser:880, drone:640 };
  function ensure() { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); return ctx; }
  function play(name) {
    if (muted) return;
    try {
      const ac = ensure(), ch = channels[cursor] || (channels[cursor] = ac.createGain());
      cursor = (cursor + 1) % channels.length; ch.disconnect(); ch.connect(ac.destination);
      const osc = ac.createOscillator(), now = ac.currentTime;
      osc.frequency.value = tones[name] || 320; ch.gain.setValueAtTime(0.035, now);
      ch.gain.exponentialRampToValueAtTime(0.001, now + 0.09); osc.connect(ch); osc.start(now); osc.stop(now + 0.1);
    } catch (_) {}
  }
  const SFX='assets/SFX/';
  const SAMPLES={                       // {file, volume, poolSize}
    gun:[SFX+'m41a-pulse-rifle.mp3',.22,5], grenade:[SFX+'grenade.mp3',.6,3],
    explosion:[SFX+'electric-explosive.mp3',.55,4], explosion2:[SFX+'electric-explosive.mp3',.6,3],
    perk:[SFX+'magic-spell.mp3',.6,2], money:[SFX+'money.mp3',.4,4],
    lightning:[SFX+'lightning01.mp3',.5,3], eggs:[SFX+'Eggs Open.mp3',.7,2],
    boss:[SFX+'praetorian01.mp3',.7,2], queenroar:[SFX+'praetorian02.mp3',.7,2],
    xenohit:[SFX+'xeno attack.mp3',.4,4], subterrahit:[SFX+'subterrahit.mp3',.4,3],
    xenopterahit:[SFX+'xenotera hit.mp3',.4,3], eldritchdie:[SFX+'eldritch sponge death.mp3',.5,2],
    mg:[SFX+'light-machine-gun.mp3',.3,3],
  };
  const pool={};
  function sample(name){
    if(muted||!SAMPLES[name])return;
    try{
      const [src,vol,psz]=SAMPLES[name];
      const arr=pool[name]||(pool[name]=Array.from({length:psz},()=>{const a=new Audio(src);a.volume=vol;return a;}));
      const a=arr.find(x=>x.paused)||arr[0];a.currentTime=0;a.play().catch(()=>{});
    }catch(_){}
  }
  function resume(){ try{ const ac=ensure(); if(ac.state==='suspended')ac.resume(); }catch(_){}
    // pre-create every SFX element, then UNLOCK each by a muted play+pause inside this gesture
    // (browsers gate HTML <audio> autoplay until an element has been played during a user gesture)
    for(const name in SAMPLES){ if(!pool[name]){ const [src,vol,psz]=SAMPLES[name];
      pool[name]=Array.from({length:psz},()=>{const a=new Audio(src);a.volume=vol;return a;}); } }
    for(const name in pool){ for(const a of pool[name]){ try{ a.muted=true;
      const p=a.play(); if(p) p.then(()=>{a.pause();a.currentTime=0;a.muted=false;}).catch(()=>{a.muted=false;}); else a.muted=false;
    }catch(_){} } }
  }
  // looping engine track while tanks are on the field (25% quieter than a normal cue)
  let tankLoop = null;
  function loopTank(on) {
    if (on && !muted) {
      if (!tankLoop) { tankLoop = new Audio(SFX + 'tank-track.mp3'); tankLoop.loop = true; tankLoop.volume = 0.45; }
      if (tankLoop.paused) { try { tankLoop.currentTime = 0; tankLoop.play().catch(() => {}); } catch (_) {} }
    } else if (tankLoop) { try { tankLoop.pause(); } catch (_) {} }
  }
  addEventListener('psdk:adstart', () => { muted = true; loopTank(false); });
  addEventListener('psdk:adend', () => { muted = false; });
  return { play, sample, resume, loopTank, setMuted(v) { muted = !!v; if (v) loopTank(false); } };
})();
function sfx(name) { AUDIO.play(name); }
G.meta.sfx = true;                        // always start UNMUTED (a stuck muted save was silencing everything)
AUDIO.setMuted(false);
// unlock browser audio on the first real user gesture (required — audio can't autoplay)
function unlockAudio(){ try{ AUDIO.resume(); }catch(_){}
  window.removeEventListener('pointerdown', unlockAudio); window.removeEventListener('keydown', unlockAudio); }
addEventListener('pointerdown', unlockAudio); addEventListener('keydown', unlockAudio);

// ---------- run flow ----------
function startRun(mode='campaign') {
  // FRESH GAME — purchased run-upgrades never carry over between games (fixes tanks/etc.
  // "leaking" in from a previous run). They persist only within a run (level → level via the shop).
  // Permanent unlocks/records (codex, endless, bestScore, sfx) are intentionally kept.
  Object.assign(G.meta, {dmg:0, squad:0, weapon:0, perkSlot:0, vehicleDrop:0, credits:0});
  G.credits = 0; save(); AUDIO.loopTank(false);
  G.mode=mode;G.loop=0;G.state='play';G.level=mode==='endless'?10:1;G.levelT=0;
  G.squad = startingSquad(); G.weapon = Math.min(BAL.start.weapon + G.meta.weapon, 4);
  G.bio = 0; G.bioNeed = 25; G.perks = {}; G.kills = 0; G.boss = null;G.streak=G.streakT=G.streakPeak=G.streakAward=G.chipHeal=G.shieldT=G.shieldHits=0;
  G.droneT = G.orbitalT = G.laserT = 0; G.laserSeq = 0;
  G.hitStop = G.flashT = G.squadFlash = G.bossKillT = G.vehicleT = 0; G.vehicleCD = 4;
  G.runStart=performance.now();G.maxSquad=G.squad;G.runBosses=0;G.creditsStart=G.credits;G.reviveUsed=false;
  seed = 1000 + G.level * 777;
  bullets.each(b => bullets.release(b)); enemies.each(en => enemies.release(en));
  gates.length = 0; blastQueue.length = 0; blastDraining = false;
}
function nextLevel() {
  if(G.mode==='endless'){G.loop++;G.state='shop';save();return;}
  G.level++;
  if (G.level > CFG.levels) { G.state = 'win'; G.endElapsed=(performance.now()-G.runStart)/1000; save(); return; }
  G.state = 'shop'; save();
}

// ---------- gates ----------
function spawnGatePair() {
  const y = -60, wPair = (CFG.W - 2 * CFG.laneMargin) / 2 - 10, wFull = CFG.W - 2 * CFG.laneMargin;
  const li = G.level - 1, GB = BAL.gates;

  const mk = (lane, allowLocked) => {
    const roll = rng();
    let kind, val, need, locked = false;
    // Reference mix: negatives are COMMON red barriers, multipliers rare
    if (roll < 0.34) { kind = 'add'; const r = GB.plus[li]; val = Math.round(rr(r[0], r[1])); need = GB.hpStepPlus(G.level); }
    else if (roll < 0.42) { kind = 'mul'; const r = GB.mult[li]; val = Math.round(rr(r[0], r[1]) * 10) / 10; need = GB.hpStepMult(G.level); }
    else if (roll < 0.52) { kind = 'wpn'; val = 0; need = GB.hpStepWpn(G.level); }
    else { kind = 'add'; const r = GB.minus[li]; val = Math.round(rr(r[0], r[1])); need = GB.hpStepPlus(G.level); }
    // LOCKED gates are ALWAYS a big red negative, unshootable, DEVASTATING on contact.
    // Only one exists at a time — steer around it.
    if (allowLocked && rng() < 0.22) { locked = true; kind = 'add';
      val = -Math.round(rr(GB.minus[li][1] * -2.2, GB.minus[li][1] * -1.4)); need = 1; }
    return { lane, y, h: 46, kind, val, shot: 0, need, live: true, locked };  // x/w derived from perspective via gateRect()
  };

  if (rng() < 0.40) {
    gates.push(mk(rng() < 0.5 ? 'L' : 'R', !lockedLive));
    return;
  }
  const g1 = mk('L', !lockedLive);
  let g2 = mk('R', !lockedLive && !g1.locked);            // never two locked gates in one pair
  const isNeg = g => g.kind === 'add' && g.val < 0;
  const impassable = g => g.locked;                      // locked = can't shoot it, only lose units
  // GUARANTEE an escape: a pair can never be BOTH impassable.
  if (impassable(g1) && impassable(g2)) g2.locked = false;

    g2 = { lane: 'R', y, h: 46, kind: 'add', val: Math.min(CFG.gateAddMax, Math.round(rr(r[0], r[1]))), shot: 0, need: GB.hpStepPlus(G.level), live: true, locked: false };

}
function gateHit(g, dmg) {           // shooting a gate improves it

function bossUpdate(dt) {

  B.x = CFG.W/2 + Math.sin(B.t * 0.7) * (CFG.W/2 - 150);
  const hpFrac = B.hp / B.maxhp;

    if (B.phase < 2) {     // lay eggs -> hatchling floods

const HORIZON_Y=125;
function roadHalfWidth(z){return 40+210*z;}
function roadY(z){return HORIZON_Y+(CFG.H-HORIZON_Y)*Math.pow(z,1.6);}
// Map a gate to the road's PERSPECTIVE at its current depth: narrow near the horizon,
// widening as it travels down the corridor toward the squad. Lane = 'L' | 'R' | 'full'.
function gateRect(g){
  // clamp the base to >=0 BEFORE the fractional power — a gate above the horizon
  // (spawns at y=-60) would otherwise give pow(negative,1/1.6)=NaN and crash the draw.
  const z = Math.max(0, Math.min(1, Math.pow(Math.max(0, g.y - HORIZON_Y) / (CFG.H - HORIZON_Y), 1/1.6)));
  const hw = roadHalfWidth(z), c = CFG.W/2;

    const sp=n>10?34:42;

// ---------- loop ----------
function frame(ts) {
  const dt = Math.min(0.033, (ts - last) / 1000 || 0.016); last = ts;
  const dbg = window.FORGE_DBG;                       // FORGE transport: pause / ×4 fast-forward
  if (!testBot && !(dbg && dbg.pause))
    for (let i = 0, n = dbg ? dbg.speed : 1; i < n; i++) update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (testBot) { G.state = 'title';
  // Chromium virtual-time may throttle requestAnimationFrame entirely. Finite
  // deterministic checkpoints advance the real game loop without keeping the
  // browser alive, so the exact --virtual-time-budget repro remains reliable.
  const advanceTest=(seconds)=>{for(let i=0;i<seconds*10&&testBot;i++){update(.1);if(G.state==='perk'&&perkChoices[0]){const p=perkChoices[0];G.perks[p]=Math.min(BAL.perks.maxRank,(G.perks[p]||0)+1);G.state=G.boss?'boss':'play';}}draw();};
  setTimeout(()=>{if(testBot){startRun();advanceTest(20);}},600);
  setTimeout(()=>{if(testBot)advanceTest(40);},30000);
}

  if (G.state === 'perk') { G.state = G.boss ? 'boss' : 'play'; return; }     // dismiss a blocking perk screen
  if (G.state === 'play') { enemies.each(e => enemies.release(e)); G.boss = null; nextLevel(); }  // straight to next level (shop)
};
const body = win.querySelector('#forgeBody'), tabsEl = win.querySelector('#forgeTabs');
function openForge(){ win.classList.add('open'); FORGE_DBG.pause = true; syncDbg(); renderTab(); }   // opening FORGE freezes the game — press ▶ to run
function closeForge(){ win.classList.remove('open'); FORGE_DBG.pause = false; syncDbg(); }
function toggleForge(){ win.classList.contains('open') ? closeForge() : openForge(); }
win.querySelector('.x').onclick = closeForge;
btn.onclick = toggleForge;
addEventListener('keydown', e => { if (e.key === 'F2') toggleForge(); });
if (/[?&]forge=1/.test(location.search)) setTimeout(() => {
  const m = location.search.match(/[?&]ftab=(\d)/); if (m) tab = Math.min(TABS.length - 1, +m[1]);
  openForge(); }, 400);   // auto-open for quick tuning sessions (?forge=1&ftab=4 deep-links a tab)
// drag by the header
(function(){ const head = win.querySelector('#forgeHead'); let sx,sy,ox,oy,drag=false;
  head.addEventListener('pointerdown', e => { if (e.target.classList.contains('x') || e.target.classList.contains('dbgBtn')) return;   // don't capture clicks meant for buttons
    drag=true; sx=e.clientX; sy=e.clientY; const r=win.getBoundingClientRect(); ox=r.left; oy=r.top; head.setPointerCapture(e.pointerId); });
  head.addEventListener('pointermove', e => { if(!drag) return;
    win.style.left = Math.max(0, ox + e.clientX - sx) + 'px'; win.style.top = Math.max(0, oy + e.clientY - sy) + 'px'; });
  head.addEventListener('pointerup', () => drag = false); })();

// ---- data binding: <input data-p="kinds.2.hpBase"> writes straight into EDIT ----
function getP(p){ return p.split('.').reduce((o,k)=>o[k], EDIT); }
function setP(p,v){ const ks=p.split('.'), last=ks.pop(); ks.reduce((o,k)=>o[k],EDIT)[last]=v; }
body.addEventListener('input', e => { const p = e.target.dataset.p; if (!p) return;
  const v = parseFloat(e.target.value); if (!Number.isFinite(v)) return;
  setP(p, v); saveEdit(); applyEditWeapons(); refreshComputed(); });

const TABS = ['UNITS','PLAYER','WEAPONS','WAVES + BOSS','WORLD','SPRITES','DATA'];
let tab = 0, spriteSel = -1, frameSel = 0, work=null, undoStack=[], brush={col:'#ff00ff',size:4,erase:false};
TABS.forEach((t,i)=>{ const d=document.createElement('div'); d.textContent=t;
  d.onclick=()=>{tab=i;spriteSel=-1;renderTab();}; tabsEl.appendChild(d); });

function hpPreview(k){ let s=''; for(let L=1;L<=10;L++) s+=`L${L}:${Math.round(kindHp(k,L))} `; return s; }
function pctShare(k){ let tot=0; for(let i=0;i<6;i++) tot+=EDIT.kinds[i].weight;
  return tot>0 ? (100*EDIT.kinds[k].weight/tot).toFixed(1)+'%' : '—'; }
function refreshComputed(){
  body.querySelectorAll('[data-hp]').forEach(el=>el.textContent=hpPreview(+el.dataset.hp));
  body.querySelectorAll('[data-pct]').forEach(el=>el.textContent=pctShare(+el.dataset.pct));
}
function num(p,step,w){ return `<input type="number" step="${step||1}" ${w?`style="width:${w}px"`:''} data-p="${p}" value="${getP(p)}">`; }

function renderTab(){
  tabsEl.querySelectorAll('div').forEach((d,i)=>d.classList.toggle('on', i===tab));
  if (tab===0){ // UNITS
    let h = `<div class="hint">HP = BASE + PER-LVL × level. WEIGHT = spawn share (live %). MIN-LVL = first level it appears. Changes apply INSTANTLY — tweak mid-run and test.</div>
      <table><tr><th></th><th>UNIT</th><th>HP BASE</th><th>HP/LVL</th><th>SPD</th><th>SIZE</th><th>💰</th><th>WEIGHT</th><th>%</th><th>MIN-LVL</th></tr>`;
    EDIT.kinds.forEach((k,i)=>{ h+=`<tr><td><canvas class="kthumb" data-kt="${i}" width="40" height="40"></canvas></td>
      <td style="color:#4ff">${k.name}</td>
      <td>${num('kinds.'+i+'.hpBase',1)}</td><td>${num('kinds.'+i+'.hpLvl',0.5)}</td>
      <td>${num('kinds.'+i+'.spd',1,44)}</td><td>${num('kinds.'+i+'.r',1,40)}</td>
      <td>${num('kinds.'+i+'.credits',1,36)}</td><td>${num('kinds.'+i+'.weight',0.5,44)}</td>
      <td class="pct" data-pct="${i}"></td><td>${num('kinds.'+i+'.minLvl',1,36)}</td></tr>
      <tr><td></td><td colspan="9" class="hpprev" data-hp="${i}"></td></tr>`; });
    body.innerHTML = h + '</table>';
    body.querySelectorAll('[data-kt]').forEach(c=>{ const a=ANIM[+c.dataset.kt];
      if(a&&a.img.ok){const cs=a.img.height;c.getContext('2d').drawImage(a.img,0,0,cs,cs,0,0,40,40);} });
  }
  else if (tab===1){ // PLAYER
    body.innerHTML = `<div class="hint">Global player combat knobs — multiply on top of weapons/shop upgrades.</div>
      <div class="row">FIRE RATE × ${num('player.rofMul',0.05)}</div>
      <div class="row">DAMAGE × ${num('player.dmgMul',0.05)}</div>
      <div class="row">ARMOR (% squad-loss prevented, 0-90) ${num('player.armor',5)}</div>`;
  }
  else if (tab===2){ // WEAPONS
    let h = `<div class="hint">Per-weapon tuning. DMG is per pellet; N = pellets per shot; SPREAD = aim jitter.</div>
      <table><tr><th>WEAPON</th><th>ROF</th><th>DMG</th><th>N</th><th>SPREAD</th></tr>`;
    EDIT.weapons.forEach((w,i)=>{ h+=`<tr><td style="color:#4ff">${w.name}</td>
      <td>${num('weapons.'+i+'.rof',0.5)}</td><td>${num('weapons.'+i+'.dmg',0.05)}</td>
      <td>${num('weapons.'+i+'.n',1,36)}</td><td>${num('weapons.'+i+'.spread',0.02)}</td></tr>`; });
    body.innerHTML = h + '</table>';
  }
  else if (tab===3){ // WAVES + BOSS
    let h = `<div class="hint">SPAWN/s = enemies per second per level. BOSS HP per level. BOSS RANGE = how far down the boss walks (bigger = closer to you).</div><table><tr><th>LVL</th>`;
    for(let i=0;i<10;i++)h+=`<th>${i+1}</th>`; h+='</tr><tr><th>SPAWN/s</th>';
    for(let i=0;i<10;i++)h+=`<td>${num('spawnRate.'+i,1,34)}</td>`; h+='</tr><tr><th>BOSS HP</th>';
    for(let i=0;i<10;i++)h+=`<td>${num('bossHp.'+i,500,48)}</td>`; h+='</tr></table>';
    h += `<div class="row" style="margin-top:10px">BOSS RANGE ${num('bossY',10)} <span class="hint">(560 = right above the squad)</span></div>
      <div class="hint" style="margin-top:8px;color:#f4f">ALIEN QUEEN</div>
      <div class="row">P1 ${num('queen.p1',1000)} P2 ${num('queen.p2',1000)} P3 ${num('queen.p3',1000)}</div>
      <div class="row">EGG INTERVAL ${num('queen.eggInt',0.2)} EGG HP ${num('queen.eggHp',10)} HATCH ${num('queen.hatch',1,36)}</div>`;
    body.innerHTML = h;
  }
  else if (tab===4){ // WORLD: barriers + rolling hazards + per-level environment
    let h = `<div class="hint" style="color:#f4f">BARRIERS — seconds between barrier pairs, per level (lower = more barriers)</div>
      <table><tr><th>LVL</th>`;
    for(let i=0;i<10;i++)h+=`<th>${i+1}</th>`; h+='</tr><tr><th>SEC</th>';
    for(let i=0;i<10;i++)h+=`<td>${num('gateInterval.'+i,0.5,40)}</td>`; h+='</tr></table>';
    h += `<div class="hint" style="color:#f4f;margin-top:14px">ROLLING HAZARDS — tumble down the path; breakables die to gunfire, armored ones must be dodged</div>
      <div class="row">EVERY ${num('rollers.interval',0.5,44)}s &nbsp; ARMORED % ${num('rollers.pctArmored',5,44)} &nbsp; FROM LVL ${num('rollers.minLvl',1,36)}</div>
      <div class="row">HP ${num('rollers.hp',2,44)} + ${num('rollers.hpLvl',1,40)}/lvl &nbsp; SPEED ${num('rollers.speed',10,48)} &nbsp; SIZE ${num('rollers.size',2,40)} &nbsp; SQUAD DMG ${num('rollers.dmg',1,36)}</div>
      <div class="hint">Temp art for now — drop real sprites in SPRITES → ITEMS → Roller (Breakable) / (Armored).</div>
      <div class="hint" style="color:#f4f;margin-top:14px">ENVIRONMENT — name each level; art auto-loads from <b>assets/env/</b> as
        L&lt;n&gt;_path.png (road tile), L&lt;n&gt;_bg.png (540×960 backdrop), L&lt;n&gt;_side.png (side tile). Missing = neon default.</div>
      <table><tr><th>LVL</th><th>NAME</th><th>PATH</th><th>BG</th><th>SIDE</th></tr>`;
    for(let i=0;i<10;i++){ const th=s=>`<img src="assets/env/L${i+1}_${s}.png?${Date.now()}" style="height:22px;border:1px solid #333;border-radius:3px"
        onerror="this.outerHTML='<span style=&quot;color:#456&quot;>—</span>'">`;
      h += `<tr><td style="color:#4ff">${i+1}</td>
        <td><input type="text" data-env="${i}" value="${(EDIT.env[i]||{}).name||''}" style="width:150px"></td>
        <td>${th('path')}</td><td>${th('bg')}</td><td>${th('side')}</td></tr>`; }
    body.innerHTML = h + '</table>';
    body.querySelectorAll('[data-env]').forEach(inp=>inp.oninput=()=>{ EDIT.env[+inp.dataset.env].name = inp.value; saveEdit(); });
  }
  else if (tab===5) renderSprites();
  else { // DATA
    body.innerHTML = `<div class="hint">Values live in <b>localStorage</b> (this browser). Export JSON to keep a copy or move between machines. Edited sprites: use DOWNLOAD on the sprite to bake the PNG into assets/ permanently.</div>
      <div class="row"><button id="fExp">⇩ EXPORT ALL (JSON)</button>
      <input type="file" id="fImp" accept=".json" style="display:none"><button id="fImpB">⇧ IMPORT JSON</button></div>
      <div class="row"><button class="warn" id="fRstV">RESET ALL VALUES</button>
      <button class="warn" id="fRstS">RESET ALL SPRITES</button></div>`;
    body.querySelector('#fExp').onclick=()=>{ const a=document.createElement('a');
      a.href='data:application/json,'+encodeURIComponent(JSON.stringify({values:EDIT,sprites:savedSprites}));
      a.download='hiveswarm_forge_backup.json'; a.click(); };
    body.querySelector('#fImpB').onclick=()=>body.querySelector('#fImp').click();
    body.querySelector('#fImp').onchange=e=>{ const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
      rd.onload=()=>{ try{ const j=JSON.parse(rd.result);
        if(j.values){EDIT=mergeEdit(editDefaults(),j.values);saveEdit();applyEditWeapons();}
        if(j.sprites){savedSprites=j.sprites;localStorage.setItem(SKEY,JSON.stringify(savedSprites));
          for(const r of REG){const s=savedSprites[r.key];if(s&&s.data){r.h.img.src=s.data;if(s.frames)r.h.frames=s.frames;}}}
        renderTab(); }catch(err){alert('Bad JSON: '+err.message);} }; rd.readAsText(f); };
    body.querySelector('#fRstV').onclick=()=>{ if(confirm('Reset ALL edited values to defaults?')){
      EDIT=editDefaults(); saveEdit(); applyEditWeapons(); renderTab(); } };
    body.querySelector('#fRstS').onclick=()=>{ if(confirm('Discard ALL edited sprites? (reload restores originals)')){
      savedSprites={}; localStorage.removeItem(SKEY); location.reload(); } };
  }
  refreshComputed();
}

// ---- SPRITES: strip browser + per-frame paint editor with add/remove ----
function cellW(r){ const im=r.h.img; return Math.round((im.naturalWidth||im.width)/Math.max(1,r.h.frames)); }
function renderSprites(){
  if (spriteSel < 0){
    let h = `<div class="hint">Pick an action slot. Paint frames, +/− frames, then SAVE (live) or DOWNLOAD the strip PNG to bake into assets/. Greyed slots have no asset yet — the game ignores them until art lands.</div>`;
    const cats = ['ENEMIES','BOSSES','PLAYER','ITEMS'];
    for (const cat of cats) {
      h += `<div class="hint" style="color:#f4f;font-size:11px;letter-spacing:2px;margin-top:10px">▸ ${cat}</div>`;
      const units = [...new Set(REG.filter(r=>r.cat===cat).map(r=>r.unit))].sort();
      for (const u of units) {
        h += `<div class="row" style="border-bottom:1px solid rgba(0,255,255,.08);padding-bottom:4px">
          <b style="color:#4ff;width:120px">${u}</b>`;
        REG.forEach((r,i)=>{ if (r.cat!==cat || r.unit!==u) return;
          if (r.h) h += `<button data-sp="${i}" style="display:inline-flex;align-items:center;gap:5px">
            <canvas data-th="${i}" width="26" height="26" style="image-rendering:pixelated"></canvas>${r.action} <span style="color:#f4f">${r.h.frames}f</span></button>`;
          else h += `<button data-mk="${i}" style="border-style:dashed;border-color:#345;color:#6a8;background:none">＋ ${r.action}</button>`; });
        h += '</div>';
      }
    }
    body.innerHTML = h;
    body.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{ spriteSel=+b.dataset.sp; frameSel=0; loadWork(); renderSprites(); });
    body.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{   // create a blank 1-frame strip and open the paint editor
      const r = REG[+b.dataset.mk], c = document.createElement('canvas');
      c.width = c.height = r.cell || 128;
      savedSprites[r.key] = { data: c.toDataURL('image/png'), frames: 1, fps: 8 };   // persist straight from the canvas — the Image may not be decoded yet
      try { localStorage.setItem(SKEY, JSON.stringify(savedSprites)); } catch(e) {}
      makeHolder(r, savedSprites[r.key].data, 1, 8);
      spriteSel = +b.dataset.mk; frameSel = 0; loadWork(); renderSprites(); });
    body.querySelectorAll('[data-th]').forEach(c=>{ const r=REG[+c.dataset.th]; const im=r.h.img;
      if(im&&(im.ok||im.complete)){ const cw=(im.naturalWidth||im.width)/Math.max(1,r.h.frames), chh=im.naturalHeight||im.height;
        try{c.getContext('2d').drawImage(im,0,0,cw,chh,0,0,26,26);}catch(e){} } });
    return;
  }
  const r = REG[spriteSel];
  let h = `<div class="row"><button id="spBack">◀ ALL SPRITES</button><b style="color:#4ff">${r.unit} · ${r.action}</b>
    ${r.h.fps!==undefined?`FPS <input type="number" id="spFps" style="width:44px" value="${r.h.fps}">`:''}</div>
    <div class="frames" id="spFrames"></div>
    <div class="row"><button id="spDup">+ DUP FRAME</button><button id="spDel" class="warn">− DEL FRAME</button>
      <button id="spUndo">↩ UNDO</button><button id="spSave">💾 SAVE LIVE</button>
      <button id="spRev" class="warn">REVERT</button><button id="spDl">⇩ DOWNLOAD PNG</button></div>
    <div class="row">🎨 <input type="color" id="spCol" value="${brush.col}"> SIZE <input type="range" id="spSize" min="1" max="24" value="${brush.size}">
      <button id="spErase">${brush.erase?'✏ PAINT':'⌫ ERASE'}</button></div>
    <canvas id="forgePaint"></canvas>`;
  body.innerHTML = h;
  body.querySelector('#spBack').onclick=()=>{spriteSel=-1;renderSprites();};
  const fpsEl=body.querySelector('#spFps'); if(fpsEl)fpsEl.oninput=()=>{const v=parseFloat(fpsEl.value);if(v>0){r.h.fps=v;persistSprite(r);}};
  body.querySelector('#spCol').oninput=e=>{brush.col=e.target.value;brush.erase=false;body.querySelector('#spErase').textContent='⌫ ERASE';};
  body.querySelector('#spSize').oninput=e=>brush.size=+e.target.value;
  body.querySelector('#spErase').onclick=e=>{brush.erase=!brush.erase;e.target.textContent=brush.erase?'✏ PAINT':'⌫ ERASE';};
  body.querySelector('#spDup').onclick=()=>frameOp('dup');
  body.querySelector('#spDel').onclick=()=>frameOp('del');
  body.querySelector('#spUndo').onclick=undo;
  body.querySelector('#spSave').onclick=applyWork;
  body.querySelector('#spRev').onclick=()=>{ if(confirm('Revert this sprite to the shipped PNG?')){
    delete savedSprites[r.key]; localStorage.setItem(SKEY,JSON.stringify(savedSprites)); location.reload(); } };
  body.querySelector('#spDl').onclick=()=>{ const a=document.createElement('a');
    a.href=work.toDataURL('image/png'); a.download=r.key+'_strip.png'; a.click(); };
  drawFrames(); drawPaint(); bindPaint();
}
function loadWork(){ const r=REG[spriteSel], im=r.h.img, cell=r.cell||128;
  work=document.createElement('canvas');
  work.width=im.naturalWidth||im.width||cell*r.h.frames;   // fallback: image not decoded yet (fresh slot)
  work.height=im.naturalHeight||im.height||cell;
  try{work.getContext('2d').drawImage(im,0,0);}catch(e){}  // blank strip stays blank
  work._frames=r.h.frames; undoStack=[]; }
function drawFrames(){ const r=REG[spriteSel], holder=body.querySelector('#spFrames'); if(!holder)return;
  holder.innerHTML=''; const cw=work.width/work._frames, chh=work.height;
  for(let f=0;f<work._frames;f++){ const c=document.createElement('canvas');
    const s=Math.min(64/cw,64/chh); c.width=Math.max(24,cw*s); c.height=chh*s;
    c.getContext('2d').drawImage(work,f*cw,0,cw,chh,0,0,c.width,c.height);
    if(f===frameSel)c.classList.add('sel');
    c.onclick=()=>{frameSel=f;drawFrames();drawPaint();}; holder.appendChild(c); } }
function drawPaint(){ const pc=body.querySelector('#forgePaint'); if(!pc)return;
  const cw=work.width/work._frames, chh=work.height, scale=Math.min(520/cw, 380/chh);
  pc.width=cw*scale; pc.height=chh*scale; pc._scale=scale;
  const g=pc.getContext('2d'); g.imageSmoothingEnabled=false;
  g.clearRect(0,0,pc.width,pc.height); g.drawImage(work,frameSel*cw,0,cw,chh,0,0,pc.width,pc.height); }
function pushUndo(){ const cw=work.width/work._frames;
  undoStack.push(work.getContext('2d').getImageData(frameSel*cw,0,cw,work.height));
  if(undoStack.length>25)undoStack.shift(); }
function undo(){ if(!undoStack.length)return; const cw=work.width/work._frames;
  work.getContext('2d').putImageData(undoStack.pop(),frameSel*cw,0); drawFrames(); drawPaint(); }
function bindPaint(){ const pc=body.querySelector('#forgePaint'); if(!pc)return; let painting=false;
  const dot=(e)=>{ const rct=pc.getBoundingClientRect(), s=pc._scale, cw=work.width/work._frames;
    const x=frameSel*cw+(e.clientX-rct.left)/s, y=(e.clientY-rct.top)/s;
    const g=work.getContext('2d'); g.save();
    if(brush.erase){g.globalCompositeOperation='destination-out';g.fillStyle='#000';}
    else g.fillStyle=brush.col;
    g.beginPath(); g.arc(x,y,brush.size/2,0,7); g.fill(); g.restore(); drawPaint(); };
  pc.addEventListener('pointerdown',e=>{painting=true;pushUndo();dot(e);pc.setPointerCapture(e.pointerId);});
  pc.addEventListener('pointermove',e=>{if(painting)dot(e);});
  pc.addEventListener('pointerup',()=>{painting=false;drawFrames();}); }
function frameOp(op){ const cw=work.width/work._frames, chh=work.height, n=work._frames;
  if(op==='del'&&n<=1)return alert('A sprite needs at least 1 frame');
  const n2=op==='dup'?n+1:n-1;
  const c2=document.createElement('canvas'); c2.width=cw*n2; c2.height=chh; const g=c2.getContext('2d');
  let dst=0;
  for(let f=0;f<n;f++){ if(op==='del'&&f===frameSel)continue;
    g.drawImage(work,f*cw,0,cw,chh,dst*cw,0,cw,chh); dst++;
    if(op==='dup'&&f===frameSel){g.drawImage(work,f*cw,0,cw,chh,dst*cw,0,cw,chh);dst++;} }
  work=c2; work._frames=n2; frameSel=Math.min(frameSel,n2-1); undoStack=[];
  drawFrames(); drawPaint(); }
function applyWork(){ const r=REG[spriteSel], data=work.toDataURL('image/png');
  r.h.img.src=data; r.h.img.ok=true; r.h.frames=work._frames;
  savedSprites[r.key]={data,frames:work._frames,fps:r.h.fps};   // persist from the work canvas, not the (maybe undecoded) Image
  try{localStorage.setItem(SKEY,JSON.stringify(savedSprites));}catch(e){alert('Sprite too large for localStorage — use DOWNLOAD instead');}
  alert('Saved — live in game now. DOWNLOAD + drop into assets/ to make it permanent in the repo.'); }
}catch(err){ console.warn('FORGE disabled:', err); }
})();

// ---------- debug ----------
window.__dbg = () => ({ state: G.state, level: G.level, squad: G.squad, weapon: G.weapon,
  levelT:G.levelT,credits: G.credits, kills: G.kills, enemies: enemies.count(), bullets: bullets.count(),gates:gates.filter(g=>g.live).length,
  perks: Object.assign({}, G.perks), laserActive: G.laserT > 0,
  bossAttack: G.boss ? G.boss.attack||null : null, vehicleActive:G.vehicleT>0,
  mode:G.mode,loop:G.loop,score:endlessScore(),endlessUnlocked:!!G.meta.endless,bestScore:G.meta.bestScore||0,sfx:!!G.meta.sfx,
  boss: G.boss ? { hp: G.boss.hp, queen: G.boss.queen, phase: G.boss.phase } : null, testBot });
</script>
