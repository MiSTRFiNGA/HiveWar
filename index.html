  const hudEl = document.getElementById('hud'); if (hudEl) hudEl.style.width = cv.width + 'px';   // HUD tracks canvas width so the level-name fill/centering lines up

// ---------- seeded rng ----------
let seed = 1234567;
function rng() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
function rr(a, b) { return a + rng() * (b - a); }

// ---------- pools ----------
function makePool(n, factory) {
  const items = new Array(n), free = new Array(n);
  for (let i = 0; i < n; i++) { items[i] = factory(); items[i]._pi = i; free[i] = n - 1 - i; }
  let top = n;
  return {
    items,
    alloc() { if (!top) return null; const it = items[free[--top]]; it.live = true; return it; },
    release(it) { if (!it.live) return; it.live = false; free[top++] = it._pi; },
    each(fn) { for (let i = 0; i < n; i++) if (items[i].live) fn(items[i]); },
    count() { return n - top; }
  };
}
const bullets  = makePool(1800,  () => ({x:0,y:0,vx:0,vy:0,dmg:1,r:3,tier:0,aoe:0,vis:false,grenade:false,pierce:false,_hit:null,live:false}));

// Weapon gates trade coverage/shape for damage rather than guaranteeing a raw-DPS increase.
// sfx/sfxRate/sfxVol/sfxMinGap + shape/len/wid are the FORGE-adjacent "look and sound

// assets/SFX sample (tuned by pitch/volume so it reads as its own gun, not the sample's
// original effect) and gets a distinct bullet silhouette so it's identifiable on sight.
const WEAPONS = [

// HW.5 — weapons with minLvl cannot be awarded by gates/picks until that campaign level.
function weaponAllowed(i, lvl) {
  const w = WEAPONS[i]; if (!w) return false;
  return (lvl || G.level || 1) >= (w.minLvl || 1);
}
function clampWeaponToLevel(i, lvl) {
  let w = Math.max(0, Math.min(WEAPON_LAST, i|0));
  while (w > 0 && !weaponAllowed(w, lvl)) w--;
  return w;
}
// ---- soldier tier x weapon tier power curve (owner spec 2026-07-30, from a competitor
// teardown — see D:\Dev\_ref\UPGRADES_AND_MONETIZATION.md §2): DPS ~= squadCount x
// soldierTierMultiplier x weaponTierMultiplier. Squad COUNT already scales DPS via bullet
// streams in fire(); these two multipliers add a persistent QUALITY axis on top so gates
// (which only ever grant count) don't become the only power lever. All 5 WEAPONS share the
// same weaponTierMult so upgrading a tier improves whichever gun you're currently rocking —
// weapons now persist level-to-level (owner request 2026-07-30, see levelStart()) rather than
// randomly rerolling, and now also persistently upgrade.
// Both start at tier 1 = multiplier 1.0 exactly, so baseline balance (incl. the CG KPI tune
// and Queen kill-time) is unchanged until the player actually buys a tier in the shop.
const WEAPON_LAST = 7;   // highest WEAPONS index — bump whenever WEAPONS grows (Rail Gun + Rocket Launcher, HW.20)
const SOLDIER_TIER_MAX = 5, WEAPON_TIER_MAX = 5, TIER_MULT_STEP = 0.12;   // +12%/tier, modest per SHOP economy notes
// Damage-side squad contribution. Squad COUNT still scales bullets/coverage/survivability
// linearly — this only softens the DAMAGE stack (see the HW.21 note on EDIT.player).
function squadPower(n) {
  n = Math.max(1, Number(n) || 1);
  const soft = Math.max(1, Number(EDIT && EDIT.player && EDIT.player.squadDmgSoft) || 24);
  const exp  = Number(EDIT && EDIT.player && EDIT.player.squadDmgExp);
  const e    = Number.isFinite(exp) && exp > 0 ? exp : 0.72;
  return n <= soft ? n : soft + Math.pow(n - soft, e);
}
function soldierTierMult(t) { return 1 + (Math.max(1, t || 1) - 1) * TIER_MULT_STEP; }
function weaponTierMult(t)  { return 1 + (Math.max(1, t || 1) - 1) * TIER_MULT_STEP; }

// ---------- gates ----------
let gatePairSeq = 0;    // shared id so a pair's two gates can find each other — never inferred from array position
function spawnGatePair() {
  const y = -60, wPair = (CFG.W - 2 * CFG.laneMargin) / 2 - 10, wFull = CFG.W - 2 * CFG.laneMargin;
  const li = G.level - 1, GB = BAL.gates;
  const lockedLive = gates.some(g => g.live && g.locked);   // only ONE locked gate on screen at a time
  const pairId = ++gatePairSeq;
  const mk = (lane, allowLocked) => {
    const roll = rng();
    let kind, val, need, locked = false;
    // POINTS-ONLY RAMP (owner request 2026-08-01): for the first MUL_UNLOCK_ROUND rounds every gate
    // is a plain +/- point value — no multipliers — so the maths stays readable while players learn
    // the barrier read. Campaign is exactly 10 levels, so multipliers first appear in endless loops.
    // A "round" counts across loops: level 3 of endless loop 1 is round 13.
    const roundNo = G.level + (G.loop || 0) * CFG.levels;
    const mulAllowed = roundNo > MUL_UNLOCK_ROUND;
    // Reference mix: negatives are COMMON red barriers, multipliers rare.
    // W1 — on level 1, widen the weapon-gate window so acquisition is not a 10% lottery.
    const wpnHi = G.level === 1 ? 0.62 : 0.52;
    if (roll < 0.34) { kind = 'add'; const r = GB.plus[li]; val = Math.round(rr(r[0], r[1])); need = GB.hpStepPlus(G.level); }
    else if (roll < 0.42 && mulAllowed) { kind = 'mul'; const r = GB.mult[li]; val = Math.round(rr(r[0], r[1]) * 10) / 10; need = GB.hpStepMult(G.level); }
    else if (roll < 0.42) { kind = 'add'; const r = GB.plus[li]; val = Math.round(rr(r[0], r[1])); need = GB.hpStepPlus(G.level); }   // pre-unlock: that slot becomes points
    else if (roll < wpnHi) { kind = 'wpn'; val = 0; need = GB.hpStepWpn(G.level); }
    else { kind = 'add'; const r = GB.minus[li]; val = Math.round(rr(r[0], r[1])); need = GB.hpStepPlus(G.level); }
    // LOCKED gates are ALWAYS a big red negative, unshootable, DEVASTATING on contact.
    // Only one exists at a time — steer around it.
    if (allowLocked && rng() < 0.22) { locked = true; kind = 'add';
      val = -Math.round(rr(GB.minus[li][1] * -2.2, GB.minus[li][1] * -1.4)); need = 1; }
    // HW.3 — one weapon per wall (never a split dual-pick on a single barrier). Choice is L vs R.
    let wpnId = null;
    if (kind === 'wpn') {
      let cand = Math.min(WEAPON_LAST, G.weapon + 1 + val);
      if (!weaponAllowed(cand, G.level)) cand = clampWeaponToLevel(cand, G.level);
      wpnId = cand;
    }

  };

  if (rng() < 0.40) {
    gates.push(mk(rng() < 0.5 ? 'L' : 'R', !lockedLive));
    return;
  }
  const g1 = mk('L', !lockedLive);
  let g2 = mk('R', !lockedLive && !g1.locked);            // never two locked gates in one pair
  // W2 (Eric playtest 2026-08-05 — still broken after a one-shot reroll): L/R MUST differ.
  // Compare a real signature (kind+val+wpnId+locked), reroll hard, then mutate if still equal.
  const gateSig = g => g.kind === 'wpn'
    ? ('wpn:' + (g.wpnId != null ? g.wpnId : g.val) + (g.locked ? ':L' : ''))
    : (g.kind + ':' + g.val + (g.locked ? ':L' : ''));
  if (!g1.locked && !g2.locked) {
    for (let attempt = 0; attempt < 14 && gateSig(g1) === gateSig(g2); attempt++) {
      g2 = mk('R', !lockedLive && !g1.locked);
    }
  }
  // HW.3 — if BOTH walls are weapon gates, force different guns (one weapon per wall, L vs R choice).
  if (g1.kind === 'wpn' && g2.kind === 'wpn' && g1.wpnId === g2.wpnId) {
    let alt = (g1.wpnId + 1 + Math.floor(rng() * 3)) % WEAPONS.length;
    alt = clampWeaponToLevel(alt, G.level);
    if (alt === g1.wpnId) alt = clampWeaponToLevel((g1.wpnId + 1) % WEAPONS.length, G.level);
    g2.wpnId = alt;
  }
  const isNeg = g => g.kind === 'add' && g.val < 0;
  const impassable = g => g.locked;                      // locked = can't shoot it, only lose units
  // GUARANTEE an escape: a pair can never be BOTH impassable.
  if (impassable(g1) && impassable(g2)) g2.locked = false;
  // never a plain double-negative (both drain you): flip the right to a positive add
  if (isNeg(g1) && isNeg(g2) && !impassable(g1)) {
    const r = GB.plus[li];
    let pos = Math.min(CFG.gateAddMax, Math.round(rr(r[0], r[1])));
    // still must not mirror the left wall after the flip (W2)
    if (g1.kind === 'add' && g1.val === pos) pos = Math.min(CFG.gateAddMax, pos + Math.max(2, Math.abs(g1.val) || 2));
    g2 = { lane: 'R', y, h: 46, kind: 'add', val: pos,
      wpnId: null, weapon2: null, shot: 0, need: GB.hpStepPlus(G.level), live: true, locked: false, pairId, spent: false };
  }

  if (!g1.locked && !g2.locked && gateSig(g1) === gateSig(g2)) {
    if (g1.kind === 'add') {
      g2.kind = 'add'; g2.wpnId = null; g2.locked = false;
      g2.val = g1.val >= 0 ? -Math.max(2, Math.abs(g1.val) + 2) : Math.max(3, Math.abs(g1.val) + 2);
      g2.need = GB.hpStepPlus(G.level);
    } else if (g1.kind === 'wpn') {
      g2.kind = 'wpn'; g2.val = 0; g2.locked = false;
      g2.wpnId = clampWeaponToLevel((g1.wpnId + 1) % WEAPONS.length, G.level);
      if (g2.wpnId === g1.wpnId) g2.wpnId = clampWeaponToLevel((g1.wpnId + 2) % WEAPONS.length, G.level);
      g2.need = GB.hpStepWpn(G.level);
    } else {
      g2.kind = 'add'; g2.val = Math.max(3, Math.round((g1.val || 1) + 3));
      g2.wpnId = null; g2.locked = false; g2.need = GB.hpStepPlus(G.level);
    }
  }
  // Eric 2026-08-07: one gate must be a hard decision — big value gap and/or higher HP so
  // the player works for the juicy side instead of both walls reading the same.
  if (!g1.locked && !g2.locked && g1.kind === 'add' && g2.kind === 'add') {
    const hi = Math.abs(g1.val) >= Math.abs(g2.val) ? g1 : g2;
    const lo = hi === g1 ? g2 : g1;
    if (Math.abs(hi.val - lo.val) < Math.max(4, Math.abs(lo.val) * 0.8)) {
      const boost = Math.max(6, Math.round(Math.abs(lo.val) * 1.8 + 4));
      hi.val = hi.val >= 0 ? boost : -boost;
    }
    // Hard gate costs more shots to crack
    hi.need = Math.max(hi.need, Math.round(GB.hpStepPlus(G.level) * 1.85));
  } else if (!g1.locked && !g2.locked && g1.kind === 'wpn' && g2.kind === 'add') {
    g2.need = Math.max(g2.need, Math.round(GB.hpStepPlus(G.level) * 1.5));
  } else if (!g1.locked && !g2.locked && g2.kind === 'wpn' && g1.kind === 'add') {
    g1.need = Math.max(g1.need, Math.round(GB.hpStepPlus(G.level) * 1.5));
  }
  gates.push(g1, g2);
}
function gateHit(g, dmg) {           // shooting a gate improves it
  if (g.locked || g.spent) return;  // locked = can't shoot it; spent = its sibling was already collected, it's inert
  g.shot += dmg;
  const li = G.level - 1, GB = BAL.gates;
  while (g.shot >= g.need) {
    g.shot -= g.need;
    if (g.kind === 'add') g.val = Math.min(CFG.gateAddMax, GB.plusCap[li], g.val + GB.stepDelta(G.level));
    else if (g.kind === 'mul') g.val = Math.min(GB.multCap[li], Math.round((g.val + 0.1) * 10) / 10);
    else if (g.kind === 'wpn') g.val = Math.min(2, g.val + 1);
  }
}
function gatePass(g) {
  // GATE EXCLUSIVITY: once a gate's sibling has been collected, it's spent — worth zero,
  // no squad effect. Locked hazards are exempt (see below) so they stay lethal to dodge.
  if (g.spent) { const gr = gateRect(g); fx(gr.x + gr.w / 2, g.y + g.h, '#888'); return; }
  // a single gate never grants more than +gateAddMax units; total squad capped at squadMax
  if (g.kind === 'add') G.squad = Math.max(g.val < 0 ? 1 : 0, G.squad + Math.min(CFG.gateAddMax, g.val));
  else if (g.kind === 'mul') { const gain = Math.min(CFG.gateAddMax, Math.round(G.squad * g.val) - G.squad);
    G.squad = g.val < 1 ? Math.max(1, Math.round(G.squad * g.val)) : G.squad + gain; }
  else if (g.kind === 'wpn') {
    // HW.3 — whole wall = one weapon. Prefer authored wpnId; fall back to ladder from current gun.
    const pick = g.wpnId != null ? g.wpnId : Math.min(WEAPON_LAST, G.weapon + 1 + g.val);
    G.weapon = clampWeaponToLevel(pick, G.level);
  }
  G.squad = Math.min(CFG.squadMax, G.squad);
  { const gr = gateRect(g); fx(gr.x + gr.w / 2, g.y + g.h, g.val >= 0 ? '#4ff' : '#f44'); }
  G.flashT = 0.16;
  sfx('gate');
  // Neuter this gate's still-live sibling — UNLESS this was a locked hazard hit (those never
  // "collect", they just hurt) or the sibling is itself locked (a locked gate must stay a
  // real threat even after its sibling was already grabbed — it's not something you "collect").
  if (!g.locked) {
    for (const o of gates) if (o !== g && o.pairId === g.pairId && o.live && !o.locked && !o.spent) { o.spent = true; o.val = 0; }
  }
  if (G.squad <= 0) die('gate');
}

let fireT = 0;
function fire(dt) {
  const w = WEAPONS[G.weapon];
  if (G.weapon !== G.codexWeapon) { G.codexWeapon = G.weapon; codexSee('weapon:' + G.weapon, 0); }
  const rof = w.rof * (1 + 0.10 * (G.perks['Overclock'] || 0)) * EDIT.player.rofMul;   // FORGE fire-rate knob
  fireT -= dt;
  // Ion Cannon charge meter (owner spec 2026-07-30: "a ball grows as it charges, then a large laser
  // blasts straight ahead"). 0..1 across the whole reload window; the render pass sizes the orb from it.
  G.ionCharge = w.shape === 'ion' ? Math.max(0, Math.min(1, 1 - fireT * rof)) : 0;
  if (fireT > 0) return;
  fireT = 1 / rof;
  AUDIO.sample(w.sfx || 'gun', {rate: w.sfxRate, vol: w.sfxVol, minGap: w.sfxMinGap});  // per-weapon report, one per volley
  // HW.18 (owner correction 2026-08-03): the bolt ladder is keyed to SQUAD SIZE, not level —
  // 1 bolt under 10 troops, 2 at 10-19, 3 at 20+. Squad size still multiplies DPS via the
  // damage-share below; the ladder only controls how many firing LANES are visible.
  const cols = G.squad >= 20 ? 3 : G.squad >= 10 ? 2 : 1;
  // Tier 1 (default/no purchase) = 1.0; higher persistent tiers remain a damage axis.
  const tierDmgMult = soldierTierMult(G.meta.soldierTier) * weaponTierMult(G.meta.weaponTier);
  if (w.shape === 'ion') {                // capital-ship beam: ONE fat piercing shot up the middle
    const b = bullets.alloc(); if (!b) return;
    b.x = G.px; b.y = muzzleY(); b.tier = G.weapon;
    b.vx = 0; b.vy = -520;                // slower than a normal bolt — you watch it travel
    b.vis = true; b.pierce = true; b._hit = new Set();   // fresh per shot; cleared on release
    // The Ion Cannon remains one focused beam, but carries the full squad volley's damage.
    // The 1/2/3 ladder limits visible projectiles, never the soldiers contributing to DPS.
    b.dmg = w.dmg * 1.1 * (1 + 0.08 * G.meta.dmg) * squadPower(G.squad) * EDIT.player.dmgMul * tierDmgMult;
    b.r = 26; b.aoe = 0; b.grenade = false; b.purple = false; b.laneKeep = false; b.arc = 0; b.rocketArt = false;
    return;
  }
  // HW.18 — LANES and PELLETS are separate axes again. The old code set `pellets = cols`, which
  // meant a 1-lane volley had exactly one pellet, so `pellets - 1 === 0` zeroed the fan and NO
  // weapon could spread until squad 10+ (owner bug report 2026-08-03: "the spread gun does not
  // spread anymore even with spread amounts").
  //   cols   = firing LANES from the squad ladder (1 / 2 / 3)
  //   w.n    = PELLETS per lane, fanned across w.spread radians — the weapon's own character
  const pellets = Math.max(1, w.n | 0);
  const total = cols * pellets;
  for (let c = 0; c < cols; c++) {
    const off = (c - (cols - 1) / 2) * 18;              // centre / left / right firing lanes
    const bx = Math.max(36, Math.min(CFG.W - 36, G.px + off));
    // Centre lane sits slightly AHEAD of its flankers (owner spec) — measured from the sprite's
    // top-centre muzzle so it tracks the squad's screen position instead of a hardcoded row.
    const by = muzzleY() - (c === Math.floor(cols / 2) && cols > 1 ? 10 : 0);
    const baseVx = (CFG.W / 2 - bx) * 0.55, baseVy = -640 * (w.spd || 1);      // converge toward road center, straight up
    const baseAngle = Math.atan2(baseVy, baseVx), speed = Math.hypot(baseVx, baseVy);
    for (let p = 0; p < pellets; p++) {
      const b = bullets.alloc(); if (!b) return;
      const fanOff = pellets === 1 ? 0 : -w.spread / 2 + w.spread * p / (pellets - 1);
      const ang = baseAngle + fanOff;
      b.x = bx; b.y = by; b.tier = G.weapon;
      b.vx = Math.cos(ang) * speed; b.vy = Math.sin(ang) * speed;
      b.vis = true;
      // Each visual bolt represents an equal share of the squad, so adding lanes/pellets spreads
      // coverage without inflating total DPS.
      b.dmg = w.dmg * squadPower(G.squad) / total * 1.1 * (1 + 0.08 * G.meta.dmg) * EDIT.player.dmgMul * tierDmgMult;
      b.r = 3 + w.dmg; b.purple = false;
      // Pooled bullets MUST have every flag rewritten, never just the ones this weapon uses.
      b.aoe = w.aoe || 0; b.grenade = !!w.rocket; b.laneKeep = !!w.rocket; b.rocketArt = !!w.rocket;
      b.pierce = !!w.pierce; if (b.pierce) b._hit = new Set(); else b._hit = null;
      b.arc = w.arc || 0;
      // life > 0 = a RANGE-LIMITED projectile (flamethrower). Pooled objects must always be reset:
      // leaving a stale life on a recycled bullet would make normal bolts vanish mid-flight.
      b.life = w.life || 0; b.burn = w.burn || 0;
    }
  }
}

function bossUpdate(dt) {
  const B = G.boss; if (!B) return;
  if (B.dead) return;
  B.t += dt;
  {   // refill the boss damage bucket (see bossHit)
    const D = (EDIT && EDIT.bossDefense) || {}, pps = Number.isFinite(D.maxPctPerSec) ? D.maxPctPerSec : 8;
    if (pps > 0 && B.maxhp > 0) {
      const cps = B.maxhp * pps / 100;
      B.dmgBucket = Math.min((Number.isFinite(B.dmgBucket) ? B.dmgBucket : cps * 1.5) + cps * dt, cps * 1.5);
    }
  }
  // Flamethrower burn on a boss. Scaled by squadPower like the enemy DoT, then run through the
  // same mitigation funnel; embers are drawn so you can see he's actually alight.
  if (B.burnT > 0) {
    B.burnT -= dt;
    const mul = Number.isFinite(EDIT.bossDefense && EDIT.bossDefense.burnMul) ? EDIT.bossDefense.burnMul : 1;
    bossHit(dt * (B.burnDps || 2.4) * squadPower(G.squad) * 0.06 * mul);
    if (rng() < 0.6) fx(B.x + rr(-70, 70), B.y + rr(-40, 50), rng() < 0.5 ? '#f83' : '#fd5');
    if (B.dead) return;
  }
  // ENTRANCE (owner request 2026-07-31): he DROPS onto the path rather than gliding down, then
  // slams to a stop — heavy screen shake + hit-stop + impact cue. Landing also freezes the corridor
  // scroll (see G.scrollT) so the arena stops moving for the fight.
  const closeY = B.queen ? EDIT.bossY - 60 : EDIT.bossY;   // queen sprite is taller, stop a bit higher
  if (B.y < closeY) {
    B.fall = Math.min(BOSS_FALL_MAX, (B.fall || BOSS_FALL_V0) + BOSS_FALL_G * dt);   // accelerate: a fall, not a glide
    B.y = Math.min(closeY, B.y + B.fall * dt);
    if (B.y >= closeY && !B.landed) {                      // TOUCHDOWN
      B.landed = true;
      G.shake = 26; G.hitStop = 0.10; G.flashT = 0.12;
      AUDIO.sample(B.queen ? 'queenroar' : 'boss');
      AUDIO.sample('explosion2');
      boom(B.x, B.y + 40, 1.2);
    }
  }
  B.x = CFG.W/2 + Math.sin(B.t * 0.7) * (CFG.W/2 - 150);
  const hpFrac = B.hp / B.maxhp;
  bossAttackUpdate(B, dt);
  // minion pressure — spawn them from ABOVE the boss so they still march the road's full length
  if (rng() < (B.queen ? 2.2 : 1.1) * dt) {
    const e = enemies.alloc();
    if (e) { e.kind = 0; const K = enemyRow(0);
      e.x = B.x + rr(-90, 90); e.y = Math.min(B.y - 120, 260); e.vx = rr(-30,30); e.vy = K.spd + 90;
      e.maxhp = e.hp = kindHp(0, G.level) * 1.4; e.r = K.r * enemyRow(0).scale; e.t = 0; e.phase = rr(0, 6.283);
      // boss-spawned enemies skip spawnWave()'s field set — lane/phase must be initialized here too,
      // or the lane-homing movement code reads e.lane as undefined and NaNs e.x (crashes gradient draws).
      e.lane = Math.max(-0.92, Math.min(0.92, (e.x - CFG.W/2) / roadHalfWidthAtY(e.y))); }
  }
  if (B.queen) {          // egg phases per EDIT.queen (p1 / p2 / p3, FORGE-editable)
    const Q = EDIT.queen, total = Q.p1 + Q.p2 + Q.p3;
    if (B.hp < total - Q.p1 && B.phase === 0) { B.phase = 1; G.shake = 8; G.hitStop=.05; }
    if (B.hp < Q.p3 && B.phase === 1) { B.phase = 2; G.shake = 8; G.hitStop=.06; }
    if (B.phase < 2) {     // lay eggs -> hatchling floods
      B.eggT += dt;
      if (B.eggT >= Q.eggInt) { B.eggT = 0;
        for (let i = 0; i < Q.hatch; i++) { const e = enemies.alloc(); if (!e) break;
          e.kind = 0; const K = enemyRow(0);
          e.x = B.x + rr(-100, 100); e.y = Math.min(B.y - 110, 300); e.vx = rr(-40, 40); e.vy = K.spd + 110;
          e.maxhp = e.hp = Q.eggHp * 0.2; e.r = K.r * 0.8 * enemyRow(0).scale; e.t = 0; e.phase = rr(0, 6.283);
          e.lane = Math.max(-0.92, Math.min(0.92, (e.x - CFG.W/2) / roadHalfWidthAtY(e.y))); } }

}
function bossAttackUpdate(B, dt) {
  B.attackWait=(B.attackWait||2)-dt;

    B.attackClock=0;B.attackX=rr(CFG.laneMargin+40,CFG.W-CFG.laneMargin-40);B.attackSide=rng()<.5?-1:1;B.attackHit=false;B.attackWait=3.6;
    AUDIO.sample((EDIT.bossAttackSfx&&EDIT.bossAttackSfx[G.level-1])||'lightning');}   // owner request 2026-07-30: distinct boss-attack telegraph cue
  if(!B.attack)return;B.attackClock+=dt;const tele=B.attack==='acid'?.9:.75,active=B.attack==='sweep'?.65:.45;

// ---------- render ----------
// Perspective re-parameterisation (owner spec 2026-07-30): horizon sits 25% down from the
// top, and the road is exactly as wide as the screen at the very bottom (was 500px on a
// 540-wide screen, stopping short of the edges). Both derived from CFG.W/CFG.H so the
// geometry survives a canvas resize; the near-horizon end keeps the old 40px/250px
// near:far ratio (scaled up to the new 270px far width) so the vanishing-point look holds.
// Vanishing point: where the path ends and the wall bases converge. Raised from 0.25 to 0.407
// (2026-07-31, owner concept-art match) so the corridor occupies less of the frame and the deep
// background gets 1.63x more room — the "walking INTO the image" read. Everything perspective
// derives from this one constant: road, walls, gates, rollers, backdrop dome.
// FORGE-driven since 2026-08-02 (owner: "extend the path further back into the distance").
// `let`, not const: EDIT.world.horizonPct moves it live, and every perspective helper below reads
// this one value, so the road, walls, gates, rollers and backdrop dome all follow in one step.
let HORIZON_Y = CFG.H * 0.407;                     // 391 on a 960-tall screen
function worldCfg(){ return (EDIT && EDIT.world) || { horizonPct:0.407, spawnBackPx:0, approachMul:1 }; }
// 0 at level start, 1 when the boss is due — drives the corridor closing in as you advance.
function levelProgress(){
  if (G.state === 'boss') return 1;
  if (G.state !== 'play') return 0;
  const d = levelDuration(Math.max(0, (G.level || 1) - 1)) || 60;
  return Math.max(0, Math.min(1, (G.levelT || 0) / d));
}
function clampHorizonPct(v, fallback){
  // Clamp hard: below 0.15 the corridor swallows the backdrop, above 0.60 it stops being a road.
  return Number.isFinite(v) ? Math.max(0.15, Math.min(0.60, v)) : fallback;
}
function applyHorizon(){
  const w = worldCfg();
  const legacy = clampHorizonPct(Number(w.horizonPct), 0.407);
  const a = clampHorizonPct(Number(w.horizonStart), legacy);
  const b = clampHorizonPct(Number(w.horizonEnd), legacy);
  HORIZON_Y = CFG.H * (a + (b - a) * levelProgress());
}
applyHorizon();
function roadHalfWidth(z){ const near = CFG.W * 0.08, far = CFG.W / 2; return near + (far - near) * z; }  // 43.2 -> 270
function roadY(z){return HORIZON_Y+(CFG.H-HORIZON_Y)*Math.pow(z,1.6);}
// Half-width of the road AT A SCREEN Y, matching the road polygon AS DRAWN.
// The road is drawn with straight lineTo edges (linear in screen y) but roadY() is pow(z,1.6), so
// inverting roadY to get a lateral extent disagrees with the visible path — at mid-corridor
// roadHalfWidth says ±156.6 where the drawn road is only ±118, putting enemies ~38px outside it.
// Use THIS for "how wide is the path here"; keep the pow-based depth for size/speed feel.
function roadHalfWidthAtY(y){ return roadHalfWidth(Math.max(0, Math.min(1, (y-HORIZON_Y)/(CFG.H-HORIZON_Y)))); }
// Map a gate to the road's PERSPECTIVE at its current depth: narrow near the horizon,
// widening as it travels down the corridor toward the squad. Lane = 'L' | 'R' | 'full'.
function gateRect(g){
  // clamp the base to >=0 BEFORE the fractional power — a gate above the horizon
  // (spawns at y=-60) would otherwise give pow(negative,1/1.6)=NaN and crash the draw.
  const z = Math.max(0, Math.min(1, Math.pow(Math.max(0, g.y - HORIZON_Y) / (CFG.H - HORIZON_Y), 1/1.6)));
  const hw = roadHalfWidthAtY(g.y), c = CFG.W/2;   // barriers span the DRAWN road width at their y
  let x, w;
  // owner request 2026-07-30 (GAME EDITS.txt): leave a real shoot-through/walk-through gap at the
  // road centerline between a gate pair — each gate used to span ~97% of its half-width (hw-6),
  // leaving almost no gap, so bullets (and enemies queued behind them) were walled off for the
  // gate's entire multi-second scroll lifetime ("kill count stops due to barriers"). First pass
  // opened a hw*0.5 gap which read as too wide, so each gate now spans 87.5% of its half-width,
  // anchored to the OUTER road edge — a hw*0.25 gap at the centerline with both gates live.
  if (g.lane === 'R') { x = c + hw * 0.125; w = hw * 0.875 - 3; }
  else if (g.lane === 'full') { x = c - hw + 4; w = hw*2 - 8; }
  else { x = c - hw + 3; w = hw * 0.875 - 3; }   // 'L' (default)
  // gh: panel height grows with depth. Only the HEIGHT takes the scale knob — width is tied to the
  // road edge and the centreline gap, so scaling it would reopen the "barriers wall off the lane" bug.
  return { x, w, z, gh: (22 + 46*z) * ENT('prop.barrier').scale };
}

// ---------- LEVEL DEBRIEF ----------
// Rows reveal one at a time and each number counts UP, so clearing a level lands as an event
// instead of an instant jump to a shop menu. Timeline is pure elapsed time (G.debriefT) so it
// cannot desync from the frame rate.
// W3: content sits lower (phone status bar). W6: TOTAL KILLS does a huge centre count-up then
// shrinks/drops into its row — the payoff moment.
const DEBRIEF_ROW_DELAY = 0.50, DEBRIEF_COUNT_TIME = 0.42;
// Centered panel (Eric 2026-08-07) — title mid-upper, rows stack through vertical center.
const DEBRIEF_TITLE_Y = 0.22, DEBRIEF_ROW0_Y = 0.34, DEBRIEF_ROW_STEP = 44;

function debriefTone(n) {
  // Game-show blip per digit tick — pitch climbs with the count.
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!G._toneCtx) G._toneCtx = new AC();
    const ctx = G._toneCtx, t0 = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square';
    o.frequency.value = 420 + Math.min(900, Math.abs(n|0) * 3.5);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.09, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.09);

}

function debriefRows() {

    if (n > 0) rows.push({ label: k.name, value: n, kind: i }); });
  rows.sort((a, b) => b.value - a.value);

  rows.push({ label: 'BIO ORBS', value: G.lvlBio || 0, col: '#6f9' });
  rows.push({ label: 'CREDIT ORBS', value: G.lvlOrbs || 0, col: '#fd4' });

function fireworkBurst() {

  const hue = ['#4ff', '#f4f', '#ff4', '#6f9', '#f86', '#fff'][(rng() * 6) | 0];
  for (let i = 0; i < 72; i++) {

  G.fireworks.push({ x, y, vx: 0, vy: 0, life: 0.4, col: hue, r: 54, flash: 1 });

function updateDebrief(dt) {

  const ti = rows.findIndex(r => r.big);
  const totalExtra = ti >= 0 ? (DEBRIEF_TOTAL_HERO + DEBRIEF_TOTAL_FLY - DEBRIEF_COUNT_TIME) : 0;
  const full = rows.length * DEBRIEF_ROW_DELAY + 0.5 + totalExtra;
  if (!G.debriefDone && G.debriefT > full) { G.debriefDone = true; G.fireT = 0; }
  if (G.debriefDone) {                       // celebration: a burst every ~0.45s

    if (G.fireT <= 0) { G.fireT = 0.38; fireworkBurst(); if (rng() < 0.45) fireworkBurst(); }
  }
  for (let i = G.fireworks.length - 1; i >= 0; i--) { const f = G.fireworks[i];

}
function drawDebrief() {

  const advanceTest=(seconds)=>{for(let i=0;i<seconds*10&&testBot;i++){update(.1);if(G.state==='perk'&&perkChoices[0]){const p=perkChoices[0];G.perks[p]=Math.min(BAL.perks.maxRank,(G.perks[p]||0)+1);G.state=G.boss?'boss':'play';}}draw();};

function readPng(file, cb){                // file -> canvas, alpha preserved (never fill a background)
  const rd = new FileReader();
  rd.onload = () => { const im = new Image();
    im.onload = () => { const sc = Math.min(1, MAX_CELL / im.height, MAX_STRIP / im.width);
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.width * sc)); c.height = Math.max(1, Math.round(im.height * sc));
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      cb(c); };
    im.onerror = () => alert('Could not read that image — a transparent PNG works best.');
    im.src = rd.result; };
  rd.readAsDataURL(file);
}
async function readGif(file, cb){
  if (!window.ImageDecoder) throw new Error('GIF import needs a current Chromium browser');
  const dec=new ImageDecoder({data:await file.arrayBuffer(),type:'image/gif'}), n=dec.tracks.selectedTrack.frameCount;
  if(n>120&&!confirm(`This GIF has ${n} frames. It may be slow to edit, but no frames will be discarded. Continue?`))return;
  const first=await dec.decode({frameIndex:0}), w=first.image.displayWidth,h=first.image.displayHeight,c=document.createElement('canvas');c.width=w*n;c.height=h;const g=c.getContext('2d');g.drawImage(first.image,0,0);first.image.close();
  for(let i=1;i<n;i++){const f=await dec.decode({frameIndex:i});g.drawImage(f.image,i*w,0);f.image.close();}dec.close();c._frames=n;cb(c);
}
// a strip lays frames side by side, so width/height rounds to the frame count (single image -> 1)
function askFrames(c){ const guess = Math.max(1, Math.round(c.width / c.height));
  const n = parseInt(prompt('Frames across in this PNG?\n(1 = single image, N = animation strip)', guess), 10);
  return (n > 0 && n <= 64) ? n : guess; }

  const prev = savedSprites[r.key];

// Shared env-art import. IndexedDB stores binary blobs, so no localStorage-size downscale is needed.
function importEnvPng(f, key, done){
  const rd = new FileReader();
  rd.onload = () => { const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas');
      c.width = im.width; c.height = im.height;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      const prev = ENV_OVR[key]; ENV_OVR[key] = c.toDataURL('image/png');
      saveEnvMedia(key).catch(() => { if (prev===undefined) delete ENV_OVR[key]; else ENV_OVR[key]=prev; alert('Could not save environment art to IndexedDB.'); return; });
      const lvl = +key.match(/^L(\d+)_/)[1]; delete ENVIMG[lvl];   // live reload for that level
      if (done) done(); };
    im.src = rd.result; };
  rd.readAsDataURL(f);
}

// ---------- MOD PACK (roadmap: players author + SHARE content) ----------
// One self-contained file carrying an entire authored setup. Versioned on purpose: PACK_FORMAT is
// the SCHEMA version and is what future builds check, while gameVersion is only informational, so
// a pack made today keeps loading after the game moves on. Unknown/missing sections are tolerated
// (mergeEdit fills defaults) — that's what lets us add fields later without breaking old packs.
//
// Sections, all optional:
//   values  — the whole EDIT tree (units, weapons, waves, scale, music filenames, level names)
//   sprites — FORGE-painted/imported sprite strips, as dataURLs
//   env     — per-level environment art (path / bg / wall L / wall R), as dataURLs
// Sounds currently travel as NAMES (values.kinds[].sfxDie etc.) referencing built-in samples;
// embedding custom audio blobs is the next step and slots in as a `sounds` section.
const PACK_FORMAT = 1;
function buildPack(name, author) {
  return { hiveWarPack: PACK_FORMAT, name, author,
           gameVersion: GAME_VERSION, created: new Date().toISOString(),
           values: EDIT, sprites: savedSprites, env: ENV_OVR, codex: CODEX_IMG };
}
async function applyPack(j) {
  if (!j || typeof j !== 'object') throw new Error('not a pack file');
  // Accept legacy backups too — they are the same payload without the header.
  const isPack = j.hiveWarPack !== undefined;
  if (isPack && j.hiveWarPack > PACK_FORMAT)
    throw new Error(`pack needs a newer game build (pack format ${j.hiveWarPack}, this build reads ${PACK_FORMAT})`);
  if (!j.values && !j.sprites && !j.env && !j.codex) throw new Error('pack contains no content');
  if (j.values) { EDIT = mergeEdit(editDefaults(), migrateForgeValues(j.values)); saveEdit(); applyEditWeapons(); applyHorizon(); }
  if (j.sprites) { savedSprites = j.sprites;
    await replaceMedia('sprite:', savedSprites);
    for (const r of REG) { const s = savedSprites[r.key];
      if (s && s.data) { if (r.h) { r.h.img.src = s.data; if (s.frames) r.h.frames = s.frames; }
                         else makeHolder(r, s.data, s.frames, s.fps); } } }
  if (j.env) { ENV_OVR = j.env;
    await replaceMedia('env:', ENV_OVR);
    for (const k in ENVIMG) delete ENVIMG[k]; }
  // Beastiary art rides along with the pack — the page TEXT is already inside j.values.
  if (j.codex && typeof j.codex === 'object') {
    for (const k in CODEX_IMG) delete CODEX_IMG[k];
    Object.assign(CODEX_IMG, j.codex);
    await queueMedia(async () => { await mediaClearNow('codex:');
      for (const id of Object.keys(CODEX_IMG)) { const data = CODEX_IMG[id]; if (!data) continue;
        await mediaPut({ id: 'codex:' + id, key: id, blob: await dataBlob(data) }); } });
  }
  const warn = (j.gameVersion && j.gameVersion !== GAME_VERSION)
    ? `Built for game v${j.gameVersion}; you are on v${GAME_VERSION}. It loaded, but some values may not line up.` : '';
  return { name: j.name || 'Unnamed pack', author: j.author || '', warn };
}

// Which part of the box a preview-space point grabs. Corners win over edges, edges over the middle.
function cropHit(px,py,s){

  const nL=Math.abs(px-x)<=T, nR=Math.abs(px-(x+w))<=T, nT=Math.abs(py-y)<=T, nB=Math.abs(py-(y+h))<=T;

// dot was drawn, so the stack stayed empty (UNDO looked dead) while dragging still painted, because

// Snapshots copy the WHOLE canvas, including its size and frame count, so undo covers structural

// Cheap up-front taint probe: read one pixel. Used to warn BEFORE any painting happens, so nobody

function canvasTainted(c){

}
const TAINT_FIX = 'Open the game with "Launch HiVE War.bat" (it serves the game at ' +
  'http://127.0.0.1:8791 and this problem disappears), or use ⇧ REPLACE PNG to import the file first.';

function safeDataURL(c){

  catch(e){ alert('The browser blocked exporting this image (' + e.name + ').\n\n' +
    'The source PNG was read from a file:// page, which taints the canvas so it can never be exported.\n\n' +
    'Fix: ' + TAINT_FIX);

}
// Load an image so the canvas stays CLEAN where possible: fetch the bytes and re-enter them as a

    return { x: frameSel*cw + (e.clientX-rct.left)/s, y: (e.clientY-rct.top)/s }; };

  const stroke=(a,b)=>{ const g=work.getContext('2d'); g.save();
