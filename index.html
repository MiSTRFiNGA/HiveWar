<script>
'use strict';
// ============================================================ HiVE WAR M0
// Single-file core. Canvas2D + strict pooling. Vector art placeholder pass
// (sprites land in M1). Conventions: ?test=1 bot, window.__dbg().
// ============================================================

// Player-facing build version. Bump this AND sw.js CACHE_VERSION together — the service worker
// serves the shell from cache, so a version bump without a cache bump ships nothing to players.
const GAME_VERSION = '2.0';
const CFG = {
  W: 540, H: 960,                 // logical portrait playfield
  // road is full-screen-width at the bottom now (see roadHalfWidth) — the player only needs
  // enough margin that the trooper sprite (~24-29px half-width) isn't clipped off-screen
  laneMargin: 28,
  scrollSpd: 170,                 // px/s world scroll
  squadCapVisible: 5,
  squadMax: 300,                  // hard cap — big-army feel; meta upgrades actually stack toward it
  gateAddMax: 999,                // gate value grows as high as you shoot it (capped by per-level plusCap)
  bloodColor: 'green',            // 'green' | 'red' (red hidden from UI; xenos always green)
  levelSeconds: 100,
  levels: 10,
};

// ---------- canvas / scaling ----------
const cv = document.getElementById('game'), cx = cv.getContext('2d');
let scale = 1;
function fit() {
  const a = innerWidth / innerHeight, ga = CFG.W / CFG.H;
  if (a > ga) { cv.height = innerHeight; cv.width = innerHeight * ga; }
  else { cv.width = innerWidth; cv.height = innerWidth / ga; }
  scale = cv.width / CFG.W;
  const hudEl = document.getElementById('hud'); if (hudEl) hudEl.style.width = cv.width + 'px';   // HUD tracks canvas width so the level-name fill/centering lines up
}
addEventListener('resize', fit); fit();

// ---------- seeded rng ----------
let seed = 1234567;
function rng() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
function rr(a, b) { return a + rng() * (b - a); }

// ---------- pools ----------
function makePool(n, factory) {
  const items = new Array(n), free = new Array(n);
  for (let i = 0; i < n; i++) { items[i] = factory(); items[i]._pi = i; free[i] = n - 1 - i; }
  let top = n;
  return {
    items,
    alloc() { if (!top) return null; const it = items[free[--top]]; it.live = true; return it; },
    release(it) { if (!it.live) return; it.live = false; free[top++] = it._pi; },
    each(fn) { for (let i = 0; i < n; i++) if (items[i].live) fn(items[i]); },
    count() { return n - top; }
  };
}
const bullets  = makePool(1800,  () => ({x:0,y:0,vx:0,vy:0,dmg:1,r:3,tier:0,aoe:0,vis:false,grenade:false,pierce:false,_hit:null,live:false}));
const enemies  = makePool(1600, () => ({x:0,y:0,vx:0,vy:0,hp:1,maxhp:1,r:10,kind:0,t:0,
  baseX:0,phase:0,mode:0,laserMark:0,live:false}));
const splats   = makePool(1400, () => ({x:0,y:0,vx:0,vy:0,r:2,a:1,red:false,spark:false,fade:1.4,_col:null,live:false}));
const dmgnums  = makePool(120,  () => ({x:0,y:0,v:0,val:0,a:1,live:false}));
const pickups  = makePool(200,  () => ({x:0,y:0,kind:0,live:false}));   // 0 biomatter 1 chip
const gates    = [];                                                     // few at a time; plain array

// ---------- game state ----------
const G = {
  state: 'title',          // title | play | perk | boss | shop | win | dead
  level: 1, t: 0, levelT: 0,
  squad: 10, weapon: 0,    // weapon INDEX 0..4 — which of the 5 WEAPONS is equipped this level.
                           // NOT the persistent quality tier — that's G.meta.weaponTier (soldier/weapon tier system).
  px: CFG.W / 2,           // squad leader x
  ratingPending: false,    // rating-prompt banner queued for the current shop/win screen (Task 3)
  credits: 0, bio: 0, bioNeed: 25,
  kills: 0, shake: 0, streak:0, streakT:0, streakPeak:0, streakAward:0, chipHeal:0, shieldT:0, shieldHits:0,
  perks: {},               // name -> stacks
  droneT: 0, orbitalT: 0, laserT: 0, laserX: 0, laserSeq: 0,
  hitStop:0, flashT:0, graceT:0, squadFlash:0, bossKillT:0, vehicleT:0, vehicleCD:4, vehicleFire:0,
  mode:'campaign', loop:0, runStart:0, maxSquad:10, runBosses:0, creditsStart:0, reviveUsed:false,
  boss: null,
  meta: load(),
};
// Weapon gates trade coverage/shape for damage rather than guaranteeing a raw-DPS increase.
// sfx/sfxRate/sfxVol/sfxMinGap + shape/len/wid are the FORGE-adjacent "look and sound
// different" data (owner request 2026-07-30): every weapon repurposes an existing
// assets/SFX sample (tuned by pitch/volume so it reads as its own gun, not the sample's
// original effect) and gets a distinct bullet silhouette so it's identifiable on sight.
const WEAPONS = [
  {name:'Blaster',     rof: 4.5, dmg: 2.0, n:1, spread:0,    col:'#5ef',   // slow single shots until powerups
   sfx:'gun',         sfxRate:1.0,  sfxVol:.22, sfxMinGap:0,     shape:'bolt',   len:22, wid:4},
  // spread is a FAN ANGLE IN RADIANS across the weapon's n pellets (owner request 2026-07-30:
  // "what happened to the cone style shooting?" — the old 0.06-0.22 values were pixel-jitter
  // leftovers and read as ~3-12 degrees, i.e. no visible cone at all).
  {name:'Spread Gun',  rof:10,   dmg: 0.62, n:2, spread:0.45, col:'#4cf',
   sfx:'mg',          sfxRate:1.15, sfxVol:.20, sfxMinGap:0,     shape:'twin',   len:16, wid:3},
  {name:'Rail Gun',    rof:12,   dmg: 0.38, n:4, spread:0.70, col:'#c6f',
   sfx:'lightning02', sfxRate:1.3,  sfxVol:.26, sfxMinGap:0.05,  shape:'pellet', len:10, wid:2.2},
  {name:'Heavy Plasma',rof:11,   dmg: 0.82, n:3, spread:0.30, col:'#f80',
   sfx:'grenade',     sfxRate:1.4,  sfxVol:.20, sfxMinGap:0.12,  shape:'orb',    len:20, wid:8},
  // Ion Cannon = capital-ship gun: charges a growing ball, then releases ONE big slow-ish beam
  // that PIERCES everything in its column. n:1/spread:0 — it doesn't fan, it punches through.
  {name:'Ion Cannon',  rof: 1.6, dmg:16.0, n:1, spread:0,    col:'#ff4',
   sfx:'lightning01', sfxRate:0.9,  sfxVol:.34, sfxMinGap:0.05,  shape:'ion',    len:34, wid:14},
];
// ---- soldier tier x weapon tier power curve (owner spec 2026-07-30, from a competitor
// teardown — see D:\Dev\_ref\UPGRADES_AND_MONETIZATION.md §2): DPS ~= squadCount x
// soldierTierMultiplier x weaponTierMultiplier. Squad COUNT already scales DPS via bullet
// streams in fire(); these two multipliers add a persistent QUALITY axis on top so gates
// (which only ever grant count) don't become the only power lever. All 5 WEAPONS share the
// same weaponTierMult so upgrading a tier improves whichever gun you're currently rocking —
// weapons now persist level-to-level (owner request 2026-07-30, see levelStart()) rather than
// randomly rerolling, and now also persistently upgrade.
// Both start at tier 1 = multiplier 1.0 exactly, so baseline balance (incl. the CG KPI tune
// and Queen kill-time) is unchanged until the player actually buys a tier in the shop.
const SOLDIER_TIER_MAX = 5, WEAPON_TIER_MAX = 5, TIER_MULT_STEP = 0.12;   // +12%/tier, modest per SHOP economy notes
function soldierTierMult(t) { return 1 + (Math.max(1, t || 1) - 1) * TIER_MULT_STEP; }
function weaponTierMult(t)  { return 1 + (Math.max(1, t || 1) - 1) * TIER_MULT_STEP; }
// visual read so a higher-tier soldier is never an invisible stat: ring/insignia colour
// climbs cyan -> blue -> violet -> orange -> gold as soldierTier rises 1 -> 5.
const SOLDIER_TIER_COLORS = ['#5ff', '#5f9fff', '#b45fff', '#ff9d3d', '#ffe23d'];
// ---- Grok balance tables (balance/balance.json v1.0, R1) ----
const BAL = {
  // Retuned with the one-soldier opening: the old horizon pass compressed travel time, and the
  // old values were calibrated for a much larger opening volley.
  spawnRate: [1.0,1.5,2.5,4.0,6.0,8.5,12.0,16.5,22.0,28.0],
  waveSec:   [75,78,82,86,90,94,98,102,106,60],
  mixEld:    [0,4,8,14,18,22,26,28,30,32],              // % eldritch — zeroed on L1
  mixCyb:    [0,0,3,8,12,16,20,23,25,27],               // % cyber-mutant — zeroed on L1-2
  hp: { bio: L => 8 + 2.0*L, eld: L => 38 + 9.5*L, cyb: L => 20 + 4.5*L },   // R2
  bossHp:    [3600,5600,8800,12800,18000,25000,30000,40000,52000,0],
  queen:     { p1:28000, p2:36000, p3:22000, eggInt:1.8, eggHp:120, hatch:6 },
  gates: {
    interval: L => Math.max(14.0, 20.0 - 0.35*(L-1)),  // CG KPI tune 2026-07-29: rarer gates, more room to breathe
    // CG KPI tune 2026-07-29: L1 minus gates were deleting the 5-9 unit starter squad in one touch
    plus:  [[2,6],[3,9],[4,12],[6,16],[8,22],[10,28],[13,34],[16,42],[20,52],[24,64]],
    plusCap: [8,14,22,32,45,60,80,105,135,170],
    minus: [[-4,-1],[-6,-2],[-10,-4],[-16,-7],[-24,-10],[-34,-14],[-46,-18],[-58,-24],[-70,-30],[-85,-40]],
    mult:  [[1.1,1.3],[1.2,1.4],[1.2,1.5],[1.3,1.6],[1.4,1.7],[1.4,1.8],[1.5,1.9],[1.6,2.0],[1.7,2.2],[1.8,2.4]],
    multCap: [1.5,1.6,1.8,2.0,2.2,2.4,2.6,2.8,3.0,3.2],
    hpStepPlus: L => Math.round(4 + 1*(L-1)),    // low threshold — the gate number climbs as fast as bullets hit it
    hpStepMult: L => Math.round(6 + 1*(L-1)),
    hpStepWpn:  L => Math.round(10 + 2*(L-1)),
    stepDelta:  L => L <= 3 ? 1 : L <= 7 ? 2 : 3,
  },
  eco: { kill: [1,4,3,6,6], boss: L => 40 + 25*L, level: L => 80 + 40*L, queen: 2500 },
  perks: { maxRank: 3, baseKinds: 3, maxExtraSlots: 2 },
  ads: { headStart: [12,20,28], reviveFrac:.5, reviveMin:20 },
  start: { weapon: 0 },
};
const PERKS = ['Chain Lightning','Drone Escort','Orbital Laser','Acid Rounds','Magnet','Overclock','Shield Matrix'];
// index into the perk_icons.png strip for each perk (undefined = no art, falls back to text only)
const PERK_ICON = {'Chain Lightning':0,'Shield Matrix':1,'Orbital Laser':2,'Acid Rounds':3,'Drone Escort':4};
const EKIND = [ // r values set from Eric's scale-reference sheet (2026-07-16); hp: CG KPI tune 2026-07-29
  {hp:1,  r:22, spd:70,  col:'#3f6', credits:1},    // 0 Xenoid — one-shot fodder L1-2
  {hp:22, r:24, spd:26,  col:'#a3e', credits:4},    // 1 Eldritch Sponge — still a sponge
  {hp:6,  r:32, spd:44,  col:'#f55', credits:3},    // 2 Cyber-Mutant — large hulk
  {hp:10, r:18, spd:105, col:'#5ff', credits:6},    // 3 Xenoptera — keep speed threat
  {hp:18, r:13, spd:38,  col:'#fb5', credits:6},    // 4 Subterra — small
  {hp:48, r:28, spd:30,  col:'#c6f', credits:14},   // 5 Cephalo-Psychoid command node — still elite
];
// Bestiary / field-guide: unlocked when first killed. tip = a real tactical secret.
const CODEX = [
  {name:'Biomorph Swarmer', cls:'Fodder Tier', tip:'Weak alone, lethal in numbers — a solid wall of them will overrun a thin squad. Widen your fire, do not tunnel on one lane.'},
  {name:'Eldritch Sponge',  cls:'Bulwark Tier', tip:'Huge health pool, slow. Acid Rounds shred it over time — tag it early and let the corrosion work while you handle the swarm.'},
  {name:'Cyber-Mutant',     cls:'Hazard Tier', tip:'Detonates on death in an AoE. In a tight cluster they chain-explode — bait the first one and let the cluster wipe itself.'},
  {name:'Xenoptera',        cls:'Skirmisher Tier', tip:'Winged xenoid — fast, erratic swoops with a green core. Do not chase; hold your lane and let it cross your fire stream.'},
  {name:'Burrower',         cls:'Ambush Tier', tip:'Erupts from beneath the squad. Watch for the ground tell and slide off the mark before it surfaces.'},
  {name:'Cephalo-Psychoid', cls:'Command Node', tip:'A coordination node — its psychic aura makes every nearby xeno surge faster. KILL IT FIRST and the swarm around it slows right back down.'},
];

// ============================================================
// HiVE FORGE — live-tunable overrides (edited by the GAME EDITOR window, F2)
// Every gameplay number the editor exposes lives here; the game reads EDIT.*
// so Eric can tweak + test without touching code. Persisted per-browser.
// ============================================================
const EDIT_KEY = 'hiveswarm_forge_v1';
const FORGE_ENTITY_VERSION = 2;
const ENEMY_ENTITY_IDS = ['enemy.xenoid','enemy.eldritchSponge','enemy.cyberMutant','enemy.xenoptera','enemy.subterra','enemy.psychoid'];
function entityDefaults(){ return [
  {id:'player.soldier', class:'player', label:'Soldier', scale:1},
  {id:'enemy.xenoid', class:'enemy', label:'Xenoid', scale:1},
  {id:'enemy.eldritchSponge', class:'enemy', label:'Eldritch Sponge', scale:1},
  {id:'enemy.cyberMutant', class:'enemy', label:'Cyber-Mutant', scale:1},
  {id:'enemy.xenoptera', class:'enemy', label:'Xenoptera', scale:1},
  {id:'enemy.subterra', class:'enemy', label:'Subterra', scale:1},
  {id:'enemy.psychoid', class:'enemy', label:'Psychoid', scale:1},
  {id:'boss.praetorian', class:'boss', label:'Praetorian', scale:1},
  {id:'boss.alienQueen', class:'boss', label:'Alien Queen', scale:1},
  {id:'hazard.rollerBreakable', class:'hazard', label:'Roller (Breakable)', scale:1},
  {id:'hazard.rollerArmored', class:'hazard', label:'Roller (Armored)', scale:1},
  {id:'vehicle.tank', class:'vehicle', label:'Tank', scale:1, range:175},
  {id:'prop.barrier', class:'prop', label:'Barrier', scale:1},
]; }
function editDefaults() { return {
  forgeEntityVersion: FORGE_ENTITY_VERSION,
  entities: entityDefaults(),
  player: { rofMul: 1, dmgMul: 1, armor: 0 },   // armor = % of squad-loss prevented (0-90)
  balance: { startCredits: 0, killCreditMul: 1, shopCostMul: 1 },
  // per-enemy: HP = hpBase + hpLvl × level (per-level scaling), spd/r/credits,
  // weight = relative spawn share (% shown live in the editor), minLvl = first level it appears
  kinds: [
    { name:'Xenoid',        hpBase:8,  hpLvl:2.0, spd:70,  r:22, credits:1,  weight:60,  minLvl:1, sfxAttack:'xenohit',      sfxDie:'xenohit' },
    { name:'Eldritch Sponge',hpBase:38, hpLvl:9.5, spd:26,  r:24, credits:4,  weight:20,  minLvl:1, sfxAttack:'xenohit',      sfxDie:'eldritchdie' },
    { name:'Cyber-Mutant',  hpBase:20, hpLvl:4.5, spd:44,  r:32, credits:3,  weight:12,  minLvl:2, sfxAttack:'xenohit',      sfxDie:'xenohit' },
    { name:'Xenoptera',     hpBase:30, hpLvl:7,   spd:105, r:18, credits:6,  weight:4.5, minLvl:4, sfxAttack:'xenopterahit', sfxDie:'xenopterahit' },
    { name:'Subterra',      hpBase:45, hpLvl:10,  spd:38,  r:13, credits:6,  weight:2.5, minLvl:6, sfxAttack:'subterrahit',  sfxDie:'subterrahit' },
    { name:'Psychoid',      hpBase:40, hpLvl:14,  spd:30,  r:28, credits:14, weight:1,   minLvl:3, sfxAttack:'xenohit',      sfxDie:'xenohit' },
  ],
  weapons: WEAPONS.map(w => ({ name:w.name, rof:w.rof, dmg:w.dmg, n:w.n, spread:w.spread, sfx:w.sfx })),
  spawnRate: BAL.spawnRate.slice(),
  bossHp: BAL.bossHp.slice(),
  queen: Object.assign({}, BAL.queen),
  bossY: 560,                                    // how far down the boss descends (bigger = closer to player)
  // per-level boss glow/fill color (owner request 2026-07-30: every non-Queen boss used the same
  // fixed purple regardless of level). Index 9 = the Queen's own level, defaults to her existing
  // green so this is a drop-in, behavior-unchanged default until FORGE-edited.
  bossGlow: Array.from({length:10}, (_,i) => i === 9 ? '#4f6' : '#a4f'),
  bossAttackSfx: Array.from({length:10}, () => 'lightning'),   // per-level boss attack cue (owner request 2026-07-30) — plays when an attack telegraphs
  // MUSIC (owner request 2026-07-30): filenames only, resolved against assets/music/. Left blank
  // by default — no tracks ship yet, so silence until real mp3s are dropped in and named here.
  titleMusic: '',
  levelMusic: Array.from({length:10}, () => ''),
  bossMusic:  Array.from({length:10}, () => ''),
  gateInterval: Array.from({length:10}, (_,i) => Math.max(12, 18 - 0.4*i)),   // sec between barrier pairs, per level
  env: Array.from({length:10}, (_,i) => ({      // per-level theming; art drops into assets/env/L<n>_*.png
    name: ['Security Outpost','City Ruins','Commercial District','Central Spire','Overrun Factory',
           'Reactor Nursery','Hive Gate','Chitin Fields','Brood Caverns',"Queen's Chamber"][i] })),
  rollers: { interval: 8, pctArmored: 35, hp: 26, hpLvl: 6, speed: 250, size: 46, dmg: 4, minLvl: 2 },
  // Escort tanks. spread = px from the squad centre to each tank. The squad formation is 7 wide at
  // 42px spacing, so it reaches ~155px from centre — the old hardcoded 74 put both tanks INSIDE
  // the ranks. 175 clears the widest formation plus the trooper sprite.
  vehicles: { spread: 175 }, // legacy UI/import compatibility; vehicle.tank.range is runtime truth
}; }
function entityById(entities, id) { return (entities || []).find(e => e && e.id === id); }
// Runtime-facing lookup. The fallback keeps a partially imported legacy pack playable.
function ENT(id) { return entityById(EDIT && EDIT.entities, id) || entityById(entityDefaults(), id) || {scale:1}; }
function enemyRow(kind) { return Object.assign({}, ((EDIT && EDIT.kinds) || [])[kind] || {}, ENT(ENEMY_ENTITY_IDS[kind] || ENEMY_ENTITY_IDS[0])); }
function migrateForgeValues(saved) {
  if (!saved || typeof saved !== 'object') return saved || {};
  const next = Object.assign({}, saved), entities = entityDefaults();
  if (Array.isArray(next.entities)) {
    next.entities.forEach(row => { const target = row && entityById(entities, row.id); if (target) Object.assign(target, row); });
  }
  const hasExplicitEntities = Array.isArray(next.entities) && next.entities.some(row => row && row.id);
  const oldScale = next.scale || {};
  const scaleFor = { 'player.soldier':'player', 'boss.praetorian':'boss', 'boss.alienQueen':'queen',
    'hazard.rollerBreakable':'roller', 'hazard.rollerArmored':'roller', 'vehicle.tank':'tank', 'prop.barrier':'gate' };
  entities.forEach((row, i) => { const legacy = scaleFor[row.id] || (row.class === 'enemy' ? 'enemy' : null);
    if (!hasExplicitEntities && legacy && Number.isFinite(oldScale[legacy])) row.scale = oldScale[legacy];
    // F1 leaves legacy enemy combat fields in `kinds` until the F2 table owns their editors.
    // Copying them here would make the compatibility controls appear to save while ENT shadows them.
  });
  if (!hasExplicitEntities && next.vehicles && Number.isFinite(next.vehicles.spread)) entityById(entities, 'vehicle.tank').range = next.vehicles.spread;
  next.entities = entities; next.forgeEntityVersion = FORGE_ENTITY_VERSION;
  delete next.scale; // global class scale is fully migrated to individual entity rows
  return next;
}
function mergeEdit(base, saved) {                // deep-ish merge so new fields appear after updates

// weapon so runs feel varied, never the same weapon twice in a row.
// Weapons wider than this scatter badly against a single-point boss hitbox — most of the volley
// simply misses. Rolling one onto the Queen finale tripled her time-to-kill (533s -> 823s in
// _queen_test.js), which reads as "my gun stopped working", not as difficulty. Boss levels therefore
// draw only from the tight-grouping weapons.
// Tuned empirically, not guessed: the threshold must exclude ONLY the genuine outlier (widest
// spread AND mediocre damage), never the high-DPS guns — an earlier over-tight value excluded too

function pickRandomWeapon(exclude, level) {

  const bossLevel = level === CFG.levels;

    if (bossLevel && WEAPONS[i].spread > BOSS_MAX_SPREAD) continue;
    pool.push(i);
  }

  if (pool.length === 1) return pool[0];

// ---------- gates ----------
let gatePairSeq = 0;    // shared id so a pair's two gates can find each other — never inferred from array position
function spawnGatePair() {
  const y = -60, wPair = (CFG.W - 2 * CFG.laneMargin) / 2 - 10, wFull = CFG.W - 2 * CFG.laneMargin;
  const li = G.level - 1, GB = BAL.gates;
  const lockedLive = gates.some(g => g.live && g.locked);   // only ONE locked gate on screen at a time
  const pairId = ++gatePairSeq;
  const mk = (lane, allowLocked) => {
    const roll = rng();
    let kind, val, need, locked = false;
    // POINTS-ONLY RAMP (owner request 2026-08-01): for the first MUL_UNLOCK_ROUND rounds every gate
    // is a plain +/- point value — no multipliers — so the maths stays readable while players learn
    // the barrier read. Campaign is exactly 10 levels, so multipliers first appear in endless loops.
    // A "round" counts across loops: level 3 of endless loop 1 is round 13.
    const roundNo = G.level + (G.loop || 0) * CFG.levels;
    const mulAllowed = roundNo > MUL_UNLOCK_ROUND;
    // Reference mix: negatives are COMMON red barriers, multipliers rare
    if (roll < 0.34) { kind = 'add'; const r = GB.plus[li]; val = Math.round(rr(r[0], r[1])); need = GB.hpStepPlus(G.level); }
    else if (roll < 0.42 && mulAllowed) { kind = 'mul'; const r = GB.mult[li]; val = Math.round(rr(r[0], r[1]) * 10) / 10; need = GB.hpStepMult(G.level); }
    else if (roll < 0.42) { kind = 'add'; const r = GB.plus[li]; val = Math.round(rr(r[0], r[1])); need = GB.hpStepPlus(G.level); }   // pre-unlock: that slot becomes points
    else if (roll < 0.52) { kind = 'wpn'; val = 0; need = GB.hpStepWpn(G.level); }
    else { kind = 'add'; const r = GB.minus[li]; val = Math.round(rr(r[0], r[1])); need = GB.hpStepPlus(G.level); }
    // LOCKED gates are ALWAYS a big red negative, unshootable, DEVASTATING on contact.
    // Only one exists at a time — steer around it.
    if (allowLocked && rng() < 0.22) { locked = true; kind = 'add';
      val = -Math.round(rr(GB.minus[li][1] * -2.2, GB.minus[li][1] * -1.4)); need = 1; }

// Vanishing point: where the path ends and the wall bases converge. Raised from 0.25 to 0.407
// (2026-07-31, owner concept-art match) so the corridor occupies less of the frame and the deep
// background gets 1.63x more room — the "walking INTO the image" read. Everything perspective
// derives from this one constant: road, walls, gates, rollers, backdrop dome.
const HORIZON_Y = CFG.H * 0.407;                   // 391 on a 960-tall screen
function roadHalfWidth(z){ const near = CFG.W * 0.08, far = CFG.W / 2; return near + (far - near) * z; }  // 43.2 -> 270
function roadY(z){return HORIZON_Y+(CFG.H-HORIZON_Y)*Math.pow(z,1.6);}
// Half-width of the road AT A SCREEN Y, matching the road polygon AS DRAWN.
// The road is drawn with straight lineTo edges (linear in screen y) but roadY() is pow(z,1.6), so
// inverting roadY to get a lateral extent disagrees with the visible path — at mid-corridor
// roadHalfWidth says ±156.6 where the drawn road is only ±118, putting enemies ~38px outside it.
// Use THIS for "how wide is the path here"; keep the pow-based depth for size/speed feel.
function roadHalfWidthAtY(y){ return roadHalfWidth(Math.max(0, Math.min(1, (y-HORIZON_Y)/(CFG.H-HORIZON_Y)))); }
// Map a gate to the road's PERSPECTIVE at its current depth: narrow near the horizon,
// widening as it travels down the corridor toward the squad. Lane = 'L' | 'R' | 'full'.
function gateRect(g){
  // clamp the base to >=0 BEFORE the fractional power — a gate above the horizon
  // (spawns at y=-60) would otherwise give pow(negative,1/1.6)=NaN and crash the draw.
  const z = Math.max(0, Math.min(1, Math.pow(Math.max(0, g.y - HORIZON_Y) / (CFG.H - HORIZON_Y), 1/1.6)));
  const hw = roadHalfWidthAtY(g.y), c = CFG.W/2;   // barriers span the DRAWN road width at their y
  let x, w;
  // owner request 2026-07-30 (GAME EDITS.txt): leave a real shoot-through/walk-through gap at the
  // road centerline between a gate pair — each gate used to span ~97% of its half-width (hw-6),
  // leaving almost no gap, so bullets (and enemies queued behind them) were walled off for the
  // gate's entire multi-second scroll lifetime ("kill count stops due to barriers"). First pass
  // opened a hw*0.5 gap which read as too wide, so each gate now spans 87.5% of its half-width,
  // anchored to the OUTER road edge — a hw*0.25 gap at the centerline with both gates live.
  if (g.lane === 'R') { x = c + hw * 0.125; w = hw * 0.875 - 3; }
  else if (g.lane === 'full') { x = c - hw + 4; w = hw*2 - 8; }
  else { x = c - hw + 3; w = hw * 0.875 - 3; }   // 'L' (default)
  // gh: panel height grows with depth. Only the HEIGHT takes the scale knob — width is tied to the
  // road edge and the centreline gap, so scaling it would reopen the "barriers wall off the lane" bug.
  return { x, w, z, gh: (22 + 46*z) * ENT('prop.barrier').scale };
}

// Shared env-art import. IndexedDB stores binary blobs, so no localStorage-size downscale is needed.
function importEnvPng(f, key, done){
  const rd = new FileReader();
  rd.onload = () => { const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas');
      c.width = im.width; c.height = im.height;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      const prev = ENV_OVR[key]; ENV_OVR[key] = c.toDataURL('image/png');
      saveEnvMedia(key).catch(() => { if (prev===undefined) delete ENV_OVR[key]; else ENV_OVR[key]=prev; alert('Could not save environment art to IndexedDB.'); return; });
      const lvl = +key.match(/^L(\d+)_/)[1]; delete ENVIMG[lvl];   // live reload for that level
      if (done) done(); };
    im.src = rd.result; };
  rd.readAsDataURL(f);
}

// ---------- MOD PACK (roadmap: players author + SHARE content) ----------
// One self-contained file carrying an entire authored setup. Versioned on purpose: PACK_FORMAT is
// the SCHEMA version and is what future builds check, while gameVersion is only informational, so
// a pack made today keeps loading after the game moves on. Unknown/missing sections are tolerated
// (mergeEdit fills defaults) — that's what lets us add fields later without breaking old packs.
//
// Sections, all optional:
//   values  — the whole EDIT tree (units, weapons, waves, scale, music filenames, level names)
//   sprites — FORGE-painted/imported sprite strips, as dataURLs
//   env     — per-level environment art (path / bg / wall L / wall R), as dataURLs
// Sounds currently travel as NAMES (values.kinds[].sfxDie etc.) referencing built-in samples;
// embedding custom audio blobs is the next step and slots in as a `sounds` section.
const PACK_FORMAT = 1;
function buildPack(name, author) {
  return { hiveWarPack: PACK_FORMAT, name, author,
           gameVersion: GAME_VERSION, created: new Date().toISOString(),
           values: EDIT, sprites: savedSprites, env: ENV_OVR };
}
async function applyPack(j) {
  if (!j || typeof j !== 'object') throw new Error('not a pack file');
  // Accept legacy backups too — they are the same payload without the header.
  const isPack = j.hiveWarPack !== undefined;
  if (isPack && j.hiveWarPack > PACK_FORMAT)
    throw new Error(`pack needs a newer game build (pack format ${j.hiveWarPack}, this build reads ${PACK_FORMAT})`);
  if (!j.values && !j.sprites && !j.env) throw new Error('pack contains no content');
  if (j.values) { EDIT = mergeEdit(editDefaults(), migrateForgeValues(j.values)); saveEdit(); applyEditWeapons(); }
  if (j.sprites) { savedSprites = j.sprites;
    await replaceMedia('sprite:', savedSprites);
    for (const r of REG) { const s = savedSprites[r.key];
      if (s && s.data) { if (r.h) { r.h.img.src = s.data; if (s.frames) r.h.frames = s.frames; }
                         else makeHolder(r, s.data, s.frames, s.fps); } } }
  if (j.env) { ENV_OVR = j.env;
    await replaceMedia('env:', ENV_OVR);
    for (const k in ENVIMG) delete ENVIMG[k]; }
  const warn = (j.gameVersion && j.gameVersion !== GAME_VERSION)
    ? `Built for game v${j.gameVersion}; you are on v${GAME_VERSION}. It loaded, but some values may not line up.` : '';
  return { name: j.name || 'Unnamed pack', author: j.author || '', warn };
}

// FORGE playtest jump: drop straight into a level, or straight into that level's boss fight.
// Reuses the normal levelStart()/spawnBoss() path so the run is a REAL one (env art, music,
// squad, balance all applied) rather than a special-cased preview that could drift from live.
function forgePlay(lvl, boss){
  if (G.state==='title' || G.state==='dead' || G.state==='win') startRun('campaign');

// ---- SPRITES: strip browser + per-frame paint editor with add/remove ----
function cellW(r){ const im=r.h.img; return Math.round((im.naturalWidth||im.width)/Math.max(1,r.h.frames)); }
// Art-only transform: redraw each animation cell into its original bounds. Runtime collision/range
// values never read this canvas, so rotation cannot alter gameplay hitboxes.
function rotateSpriteArt(degrees){ if(!work) return; pushUndo(); const frames=work._frames||1, cw=work.width/frames, ch=work.height;
  const out=document.createElement('canvas'); out.width=work.width; out.height=ch; const g=out.getContext('2d'), rad=degrees*Math.PI/180;
  for(let f=0;f<frames;f++){ g.save(); g.translate(f*cw+cw/2,ch/2); g.rotate(rad); g.drawImage(work,f*cw,0,cw,ch,-cw/2,-ch/2,cw,ch); g.restore(); }
  out._frames=frames; work=out; drawFrames(); drawPaint(); }
function alphaKeySprite(hex,tolerance){ if(!work||canvasTainted(work)){alert('Alpha key needs a clean imported image; use ⇧ IMPORT PNG/GIF first.');return;} const m=/^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(hex); if(!m)return;
  pushUndo(); const [r,g,b]=[1,2,3].map(i=>parseInt(m[i],16)), c=document.createElement('canvas'); c.width=work.width;c.height=work.height;const x=c.getContext('2d');x.drawImage(work,0,0);const d=x.getImageData(0,0,c.width,c.height);for(let i=0;i<d.data.length;i+=4){const q=Math.hypot(d.data[i]-r,d.data[i+1]-g,d.data[i+2]-b);if(q<=tolerance)d.data[i+3]=0;}x.putImageData(d,0,0);c._frames=work._frames;work=c;drawFrames();drawPaint(); }
function tileSpriteArt(nx,ny){ if(!work)return;nx=Math.min(16,Math.max(1,nx));ny=Math.min(16,Math.max(1,ny));const f=work._frames||1,cw=work.width/f,ch=work.height;if(cw*nx*f*ch*ny>16000000){alert('Tile output exceeds the 16 MP editing budget.');return;}pushUndo();const out=document.createElement('canvas');out.width=cw*nx*f;out.height=ch*ny;const g=out.getContext('2d');for(let i=0;i<f;i++)for(let y=0;y<ny;y++)for(let x=0;x<nx;x++)g.drawImage(work,i*cw,0,cw,ch,i*cw*nx+x*cw,y*ch,cw,ch);out._frames=f;work=out;drawFrames();drawPaint(); }
function renderSprites(){
  if (spriteSel < 0){
    let h = `<div class="hint"><b style="color:#4ff">⇧</b> on any slot = pick a transparent PNG from disk — it goes live in the game instantly
      (single image or a frames-side-by-side strip). Or click a slot to paint frames, +/− frames, then SAVE (live) / DOWNLOAD the strip PNG
      to bake into assets/. Greyed slots have no asset yet — the game ignores them until art lands.</div>`;

      h += `<div class="hint" style="color:#f4f;font-size:11px;letter-spacing:2px;margin-top:10px">▸ ${cat}</div>`;
      const units = [...new Set(REG.filter(r=>r.cat===cat).map(r=>r.unit))].sort();

    body.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{ spriteSel=+b.dataset.sp; frameSel=0; loadWork(); renderSprites(); });
    body.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{   // create a blank 1-frame strip and open the paint editor

      savedSprites[r.key] = { data: c.toDataURL('image/png'), frames: 1, fps: 8 };   // persist straight from the canvas — the Image may not be decoded yet
      saveSpriteMedia(r).catch(()=>alert('Could not create sprite in IndexedDB.'));

    <div class="row">ART ROTATE <input type="number" id="spRot" min="-180" max="180" step="1" value="0" style="width:54px" aria-label="Rotate sprite art degrees"><label><input type="checkbox" id="spRotLock"> 15° LOCK</label><button id="spRotGo">↻ APPLY</button><button id="spRotL">◀ 1°</button><button id="spRotR">1° ▶</button><span class="hint">art only — frame bounds and gameplay hitboxes stay unchanged</span></div>
    <div class="row">ALPHA KEY <input type="color" id="spKey" value="#ff00ff" aria-label="Alpha key color"> TOL <input type="number" id="spKeyTol" min="0" max="442" value="24" style="width:48px" aria-label="Alpha key tolerance"><button id="spKeyGo">✦ REMOVE</button></div>
    <div class="row">TILE <input type="number" id="spTileX" min="1" max="16" value="1" style="width:42px" aria-label="Horizontal tiles"> × <input type="number" id="spTileY" min="1" max="16" value="1" style="width:42px" aria-label="Vertical tiles"><button id="spTileGo">▦ APPLY</button><span class="hint">seam preview is the canvas grid</span></div>
    <div class="row">🎨 <input type="color" id="spCol" value="${brush.col}"> SIZE <input type="range" id="spSize" min="1" max="24" value="${brush.size}">
      <button id="spErase">${brush.erase?'✏ PAINT':'⌫ ERASE'}</button></div>
    <div id="spTaint" style="display:none;margin:8px 0;padding:8px 10px;border:1px solid #f66;border-radius:6px;background:#2a0b12;color:#fbb">

      Launch with <b>Launch HiVE War.bat</b> (http://127.0.0.1:8791), or use ⇧ IMPORT PNG to bring this strip in first.</div>

  body.innerHTML = h;
  body.querySelector('#spBack').onclick=()=>{ const returnId = entityReturnId; spriteSel=-1; entityReturnId=null;
    if (returnId) { tab=0; renderTab(); setTimeout(()=>body.querySelector(`[data-entity-sprite="${returnId}"]`)?.focus(),0); }
    else renderSprites(); };
  const fpsEl=body.querySelector('#spFps'); if(fpsEl)fpsEl.oninput=()=>{const v=parseFloat(fpsEl.value);if(v>0){r.h.fps=v;persistSprite(r);}};
  body.querySelector('#spCol').oninput=e=>{brush.col=e.target.value;brush.erase=false;body.querySelector('#spErase').textContent='⌫ ERASE';};
  body.querySelector('#spSize').oninput=e=>brush.size=+e.target.value;
  body.querySelector('#spErase').onclick=e=>{brush.erase=!brush.erase;e.target.textContent=brush.erase?'✏ PAINT':'⌫ ERASE';};
  body.querySelector('#spDup').onclick=()=>frameOp('dup');
  body.querySelector('#spDel').onclick=()=>frameOp('del');
  body.querySelector('#spImp').onclick=()=>{ const inp=document.createElement('input');
    inp.type='file'; inp.accept='image/png,image/gif,image/*';
    inp.onchange=()=>{ const f=inp.files[0]; if(!f)return;
      ((f.type==='image/gif'||/\.gif$/i.test(f.name))?readGif(f, c=>{
        work=c; appliedRotation=0; frameSel=0; undoStack=[]; drawFrames();drawPaint();
      }):readPng(f, c=>{
        if (confirm('OK = replace the WHOLE strip with this PNG.\nCancel = drop it into the selected frame only.')) {
          work = c; work._frames = askFrames(c); appliedRotation=0; frameSel = 0; undoStack = [];
        } else {                                        // fit into the current cell, centred, transparency intact

        }
        drawFrames(); drawPaint(); })).catch(e=>alert('Could not import GIF: '+e.message)); };

  body.querySelector('#spUndo').onclick=undo;
  const rotateFromControl=delta=>{const el=body.querySelector('#spRot'), lock=body.querySelector('#spRotLock').checked;let base=parseFloat(el.value)||0, v=base+delta;if(lock&&delta)v=(delta>0?Math.floor(base/15)+1:Math.ceil(base/15)-1)*15;else if(lock)v=Math.round(v/15)*15;el.value=v;const d=v-appliedRotation;if(d){rotateSpriteArt(d);appliedRotation=v;}};
  body.querySelector('#spRotGo').onclick=()=>rotateFromControl(0);

// Load a WORLD tile into the shared `work` canvas as a 1-frame strip, so the sprite painter's
// drawPaint / pushUndo / undo / bindPaint all apply to it unchanged. Async because the source has
// to decode first; a slot with no art yet opens as a blank tile at that slot's natural size.
// Walk a candidate list, first one that loads wins. Wall slots need this: no _sideL/_sideR PNG
// ships, so without the legacy _side fallback they opened as an empty canvas.
function loadCleanImageList(srcs, cb){
  let i = 0;
  const next = () => { if (i >= srcs.length) return cb(null);
    loadCleanImage(srcs[i++], im => im ? cb(im) : next()); };
  next();
}
function loadEnvWork(key, done){
  const m = key.match(/^L(\d+)_(.+)$/), isBg = /_bg$/.test(key);
  const srcs = m ? envSrcList(+m[1], m[2]) : [ENV_OVR[key] || ('assets/env/' + key + '.png')];
  loadCleanImageList(srcs, im => {
    work = document.createElement('canvas');
    if (im) { work.width = im.naturalWidth || 512; work.height = im.naturalHeight || 512;
              try { work.getContext('2d').drawImage(im, 0, 0); } catch (e) {} }
    else { work.width = isBg ? 540 : 512; work.height = isBg ? 960 : 512; }   // genuinely empty slot
    work._frames = 1; frameSel = 0; undoStack = []; done(!!im);
