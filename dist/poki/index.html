<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>HiVE SWARM</title>
<style>
  html,body{margin:0;padding:0;background:#07030f;overflow:hidden;touch-action:none;
    font-family:'Segoe UI',system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  #game{display:block;margin:0 auto;background:#0a0518}
  #hud{position:fixed;top:8px;left:50%;transform:translateX(-50%);color:#9ff;
    font-weight:700;font-size:18px;text-shadow:0 0 8px #0ff;pointer-events:none;z-index:5}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<script src="psdk_adapter.js"></script>
<script>
'use strict';
// ============================================================ HiVE SWARM M0
// Single-file core. Canvas2D + strict pooling. Vector art placeholder pass
// (sprites land in M1). Conventions: ?test=1 bot, window.__dbg().
// ============================================================

const CFG = {
  W: 540, H: 960,                 // logical portrait playfield
  laneMargin: 60,
  scrollSpd: 170,                 // px/s world scroll
  squadCapVisible: 160,
  bloodColor: 'green',            // 'green' | 'red' (red hidden from UI; xenos always green)
  levelSeconds: 100,
  levels: 10,
};

// ---------- canvas / scaling ----------
const cv = document.getElementById('game'), cx = cv.getContext('2d');
let scale = 1;
function fit() {
  const a = innerWidth / innerHeight, ga = CFG.W / CFG.H;
  if (a > ga) { cv.height = innerHeight; cv.width = innerHeight * ga; }
  else { cv.width = innerWidth; cv.height = innerWidth / ga; }
  scale = cv.width / CFG.W;
}
addEventListener('resize', fit); fit();

// ---------- seeded rng ----------
let seed = 1234567;
function rng() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
function rr(a, b) { return a + rng() * (b - a); }

// ---------- pools ----------
function makePool(n, factory) {
  const items = new Array(n), free = new Array(n);
  for (let i = 0; i < n; i++) { items[i] = factory(); items[i]._pi = i; free[i] = n - 1 - i; }
  let top = n;
  return {
    items,
    alloc() { if (!top) return null; const it = items[free[--top]]; it.live = true; return it; },
    release(it) { if (!it.live) return; it.live = false; free[top++] = it._pi; },
    each(fn) { for (let i = 0; i < n; i++) if (items[i].live) fn(items[i]); },
    count() { return n - top; }
  };
}
const bullets  = makePool(900,  () => ({x:0,y:0,vx:0,vy:0,dmg:1,r:3,tier:0,aoe:0,live:false}));
const enemies  = makePool(1600, () => ({x:0,y:0,vx:0,vy:0,hp:1,maxhp:1,r:10,kind:0,t:0,
  baseX:0,phase:0,mode:0,laserMark:0,live:false}));
const splats   = makePool(500,  () => ({x:0,y:0,vx:0,vy:0,r:2,a:1,red:false,live:false}));
const dmgnums  = makePool(120,  () => ({x:0,y:0,v:0,val:0,a:1,live:false}));
const pickups  = makePool(200,  () => ({x:0,y:0,kind:0,live:false}));   // 0 biomatter 1 chip
const gates    = [];                                                     // few at a time; plain array

// ---------- game state ----------
const G = {
  state: 'title',          // title | play | perk | boss | shop | win | dead
  level: 1, t: 0, levelT: 0,
  squad: 10, weapon: 0,    // weapon tier 0..4
  px: CFG.W / 2,           // squad leader x
  credits: 0, bio: 0, bioNeed: 25,
  kills: 0, shake: 0,
  perks: {},               // name -> stacks
  droneT: 0, orbitalT: 0, laserT: 0, laserX: 0, laserSeq: 0,
  hitStop:0, flashT:0, squadFlash:0, bossKillT:0, vehicleT:0, vehicleCD:4, vehicleFire:0,
  mode:'campaign', loop:0, runStart:0, maxSquad:10, runBosses:0, creditsStart:0, reviveUsed:false,
  boss: null,
  meta: load(),
};
// Weapon DPS ratios follow balance/balance.json dpsMult [1,1.55,2.3,3.4,5]
const WEAPONS = [
  {name:'Blaster',     rof: 8, dmg: 1.00, n:1, spread:0,    col:'#5ef'},
  {name:'Twin Plasma', rof:10, dmg: 0.62, n:2, spread:0.06, col:'#4cf'},
  {name:'Scatter Rail',rof:12, dmg: 0.38, n:4, spread:0.22, col:'#c6f'},
  {name:'Heavy Plasma',rof:11, dmg: 0.82, n:3, spread:0.10, col:'#f80'},
  {name:'Orbital Link',rof: 9, dmg: 0.89, n:5, spread:0.18, col:'#ff4'},
];
// ---- Grok balance tables (balance/balance.json v1.0, R1) ----
const BAL = {
  spawnRate: [8,11,14,18,22,27,32,34,39,44],            // enemies/sec by level (R2)
  waveSec:   [70,74,78,82,86,90,94,98,102,55],
  mixEld:    [10,12,15,18,22,25,28,30,32,33],           // % eldritch
  mixCyb:    [0,3,7,12,16,20,22,25,26,27],              // % cyber-mutant
  hp: { bio: L => 8 + 2.0*L, eld: L => 38 + 9.5*L, cyb: L => 20 + 4.5*L },   // R2
  bossHp:    [2200,3400,5000,7200,10000,13500,16000,21000,28000,0],           // R2 trim L7-9
  queen:     { p1:28000, p2:36000, p3:22000, eggInt:1.8, eggHp:120, hatch:6 },
  gates: {
    interval: L => Math.max(3.0, 4.2 - 0.12*(L-1)),
    plus:  [[3,12],[5,16],[8,22],[10,28],[12,35],[15,42],[18,50],[22,58],[26,68],[30,80]],
    plusCap: [28,40,55,70,90,110,135,160,190,220],
    minus: [[-8,-2],[-12,-4],[-16,-6],[-20,-8],[-28,-10],[-35,-12],[-42,-15],[-50,-18],[-60,-22],[-70,-25]],
    mult:  [[1.2,1.5],[1.3,1.6],[1.4,1.7],[1.5,1.8],[1.5,2.0],[1.6,2.0],[1.7,2.2],[1.8,2.3],[2.0,2.5],[2.0,2.6]],
    multCap: [2.0,2.2,2.4,2.6,2.8,2.8,2.9,3.0,3.1,3.2],  // R2 soft L6-10
    hpStepPlus: L => Math.round(6 + 0.9*(L-1)),
    hpStepMult: L => Math.round(10 + 1.3*(L-1)),
    hpStepWpn:  L => Math.round(18 + 2.0*(L-1)),
    stepDelta:  L => L <= 3 ? 1 : L <= 7 ? 2 : 3,
  },
  eco: { kill: [1,4,3,6,6], boss: L => 40 + 25*L, level: L => 80 + 40*L, queen: 2500 },
  perks: { maxRank: 3, baseKinds: 3, maxExtraSlots: 2 },
  start: { squad: 8, weapon: 0 },
};
const PERKS = ['Chain Lightning','Drone Escort','Orbital Laser','Acid Rounds','Magnet','Overclock','Shield Matrix'];
const EKIND = [ // fodder, eldritch, cyber-mutant, winged diver, burrower
  {hp:2,  r:11, spd:70,  col:'#3f6', credits:1},
  {hp:26, r:26, spd:26,  col:'#a3e', credits:4},
  {hp:7,  r:15, spd:48,  col:'#f55', credits:3},
  {hp:12, r:14, spd:105, col:'#5ff', credits:6},
  {hp:20, r:18, spd:38,  col:'#fb5', credits:6},
];

function load() {
  try { return Object.assign({dmg:0,squad:0,weapon:0,credits:0,perkSlot:0,vehicleDrop:0,endless:false,bestScore:0,sfx:true},
    JSON.parse(localStorage.getItem('hiveswarm_v1') || '{}')); }
  catch(e) { return {dmg:0,squad:0,weapon:0,credits:0,perkSlot:0,vehicleDrop:0,endless:false,bestScore:0,sfx:true}; }
}
function save() {
  G.meta.credits = G.credits;
  try { localStorage.setItem('hiveswarm_v1', JSON.stringify(G.meta)); } catch(e) {}
}

// ---------- input ----------
let dragX = null, testBot = /[?&]test=1/.test(location.search);
function px2game(e) { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / scale; }
function py2game(e) { const r=cv.getBoundingClientRect(); return (e.clientY-r.top)/scale; }
function down(e) { botOff(e); const p=e.touches?e.touches[0]:e; dragX=px2game(p); const gy=py2game(p);
  if (dragX>CFG.W-65&&gy<70) { G.meta.sfx=!G.meta.sfx; AUDIO.setMuted(!G.meta.sfx); save(); return; }
  if (G.state === 'title') { if(G.meta.endless&&gy>610) startRun('endless'); else startRun('campaign'); }
  else if (G.state === 'perk') pickPerk(px2game(e.touches ? e.touches[0] : e), (e.touches?e.touches[0].clientY:e.clientY));
  else if (G.state === 'shop') shopTap(e);
  else if (G.state === 'dead'&&gy>610&&gy<720) attemptRevive();
  else if (G.state === 'win' || G.state === 'dead') { G.state = 'title'; }
}
function move(e) { if (dragX === null) return; const x = px2game(e.touches ? e.touches[0] : e);
  if (G.state === 'play' || G.state === 'boss') G.px = Math.max(CFG.laneMargin, Math.min(CFG.W - CFG.laneMargin, x));
}
function up() { dragX = null; }
function botOff(e) { if (testBot && e.isTrusted) testBot = false; }
addEventListener('mousedown', down); addEventListener('mousemove', move); addEventListener('mouseup', up);
addEventListener('touchstart', down, {passive:true}); addEventListener('touchmove', move, {passive:true});
addEventListener('touchend', up);

// ---------- audio (pooled channel stub; real samples land in the audio pass) ----------
const AUDIO = (() => {
  let ctx = null, muted = false, cursor = 0;
  const channels = new Array(8).fill(null);
  const tones = { gate:520, perk:700, elite:180, boss:95, laser:880, drone:640 };
  function ensure() { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); return ctx; }
  function play(name) {
    if (muted) return;
    try {
      const ac = ensure(), ch = channels[cursor] || (channels[cursor] = ac.createGain());
      cursor = (cursor + 1) % channels.length; ch.disconnect(); ch.connect(ac.destination);
      const osc = ac.createOscillator(), now = ac.currentTime;
      osc.frequency.value = tones[name] || 320; ch.gain.setValueAtTime(0.035, now);
      ch.gain.exponentialRampToValueAtTime(0.001, now + 0.09); osc.connect(ch); osc.start(now); osc.stop(now + 0.1);
    } catch (_) {}
  }
  addEventListener('psdk:adstart', () => { muted = true; });
  addEventListener('psdk:adend', () => { muted = false; });
  return { play, setMuted(v) { muted = !!v; } };
})();
function sfx(name) { AUDIO.play(name); }
AUDIO.setMuted(!G.meta.sfx);

// ---------- run flow ----------
function startRun(mode='campaign') {
  G.mode=mode;G.loop=0;G.state='play';G.level=mode==='endless'?10:1;G.levelT=0;
  G.squad = BAL.start.squad + G.meta.squad * 2; G.weapon = Math.min(BAL.start.weapon + G.meta.weapon, 4);
  G.bio = 0; G.bioNeed = 25; G.perks = {}; G.kills = 0; G.boss = null;
  G.droneT = G.orbitalT = G.laserT = 0; G.laserSeq = 0;
  G.hitStop = G.flashT = G.squadFlash = G.bossKillT = G.vehicleT = 0; G.vehicleCD = 4;
  G.runStart=performance.now();G.maxSquad=G.squad;G.runBosses=0;G.creditsStart=G.credits;G.reviveUsed=false;
  seed = 1000 + G.level * 777;
  bullets.each(b => bullets.release(b)); enemies.each(en => enemies.release(en));
  gates.length = 0;
}
function nextLevel() {
  if(G.mode==='endless'){G.loop++;G.state='shop';save();return;}
  G.level++;
  if (G.level > CFG.levels) { G.state = 'win'; save(); return; }
  G.state = 'shop'; save();
}
function levelStart() { G.state = 'play'; G.levelT = 0; G.boss = null; seed = 1000 + G.level * 777; gates.length = 0; }
function endlessScore(){return Math.floor(G.kills*10+G.runBosses*500+G.maxSquad*2+G.loop*2000+
  Math.max(0,G.credits-G.creditsStart)*.25+(G.weapon+1)*100);}
async function attemptRevive(){if(G.reviveUsed)return;let ok=false;try{ok=!!(window.PSDK&&await PSDK.rewarded());}catch(_){}
  if(ok){G.reviveUsed=true;G.squad=Math.max(20,Math.floor(G.maxSquad*.5));G.state=G.boss?'boss':'play';}}

// ---------- gates ----------
function spawnGatePair() {
  const y = -60, w = (CFG.W - 2 * CFG.laneMargin) / 2 - 10;
  const li = G.level - 1, GB = BAL.gates;
  const mk = (x, i) => {
    const roll = rng();
    let kind, val, need;
    if (roll < 0.42) { kind = 'add'; const r = GB.plus[li]; val = Math.round(rr(r[0], r[1])); need = GB.hpStepPlus(G.level); }
    else if (roll < 0.60) { kind = 'mul'; const r = GB.mult[li]; val = Math.round(rr(r[0], r[1]) * 10) / 10; need = GB.hpStepMult(G.level); }
    else if (roll < 0.75) { kind = 'wpn'; val = 0; need = GB.hpStepWpn(G.level); }
    else { kind = 'add'; const r = GB.minus[li]; val = Math.round(rr(r[0], r[1])); need = GB.hpStepPlus(G.level); }
    return { x, y, w, h: 46, kind, val, shot: 0, need, live: true };
  };
  gates.push(mk(CFG.laneMargin + 5, 0), mk(CFG.W / 2 + 5, 1));
}
function gateHit(g, dmg) {           // shooting a gate improves it
  g.shot += dmg;
  const li = G.level - 1, GB = BAL.gates;
  while (g.shot >= g.need) {
    g.shot -= g.need;
    if (g.kind === 'add') g.val = Math.min(GB.plusCap[li], g.val + GB.stepDelta(G.level));
    else if (g.kind === 'mul') g.val = Math.min(GB.multCap[li], Math.round((g.val + 0.1) * 10) / 10);
    else if (g.kind === 'wpn') g.val = Math.min(2, g.val + 1);
  }
}
function gatePass(g) {
  if (g.kind === 'add') G.squad = Math.max(0, G.squad + g.val);
  else if (g.kind === 'mul') G.squad = Math.max(0, Math.round(G.squad * g.val));
  else if (g.kind === 'wpn') G.weapon = Math.min(4, G.weapon + 1 + g.val);
  fx(g.x + g.w / 2, g.y + g.h, g.val >= 0 ? '#4ff' : '#f44');
  G.flashT = 0.16;
  sfx('gate');
  if (G.squad <= 0) die();
}

// ---------- combat ----------
let fireT = 0;
function fire(dt) {
  const w = WEAPONS[G.weapon];
  const rof = w.rof * (1 + 0.15 * (G.perks['Overclock'] || 0));
  fireT -= dt;
  if (fireT > 0) return;
  fireT = 1 / rof;
  // R3 power-scaled columns (fixes late-game DPS flatline past 14 squad)
  const cols = Math.min(G.squad, Math.min(48, Math.max(1, Math.floor(14 * Math.pow(Math.max(G.squad, 1) / 14, 0.45)))));
  for (let c = 0; c < cols; c++) {
    for (let i = 0; i < w.n; i++) {
      const b = bullets.alloc(); if (!b) return;
      const off = (c - (cols - 1) / 2) * 16;
      b.x = G.px + off; b.y = CFG.H - 130; b.tier = G.weapon;
      const sp = (i - (w.n - 1) / 2) * w.spread;
      b.vx = Math.sin(sp) * 640; b.vy = -Math.cos(sp) * 640;
      b.dmg = w.dmg * (1 + 0.08 * G.meta.dmg) * (1 + 0.06 * Math.log2(1 + G.squad));
      b.r = 3 + w.dmg; b.aoe = 0;
    }
  }
}
function perkWeapons(dt) {
  const drones = 2 * (G.perks['Drone Escort'] || 0);
  if (drones) {
    G.droneT -= dt;
    if (G.droneT <= 0) {
      G.droneT = Math.max(0.18, 0.42 - drones * 0.025);
      for (let i = 0; i < drones; i++) {
        const b = bullets.alloc(); if (!b) break;
        const a = G.t * 2.4 + i * 6.283 / drones;
        b.x = G.px + Math.cos(a) * 54; b.y = CFG.H - 120 + Math.sin(a) * 25;
        b.vx = Math.sin(a) * 45; b.vy = -720; b.dmg = 1.5 + 0.5 * (G.perks['Drone Escort'] || 0);
        b.r = 4; b.tier = Math.min(4, G.weapon + 1); b.aoe = 0;
      }
    }
  }
  const orbital = G.perks['Orbital Laser'] || 0;
  if (!orbital) return;
  if (G.laserT > 0) {
    G.laserT -= dt; G.laserX = CFG.laneMargin + (CFG.W - 2 * CFG.laneMargin) * (1 - G.laserT / 0.7);
    enemies.each(e => { if (e.mode !== 1 && e.laserMark !== G.laserSeq && Math.abs(e.x - G.laserX) < 20) {
      e.laserMark = G.laserSeq; damageEnemy(e, 10 + orbital * 7, e.x, e.y); } });
    return;
  }
  G.orbitalT -= dt;
  if (G.orbitalT <= 0) { G.orbitalT = Math.max(4.5, 9 - orbital * 1.2); G.laserT = 0.7; G.laserSeq++; sfx('laser'); }
}
function vehicleUpdate(dt) {
  const rank = Math.min(5, G.meta.vehicleDrop || 0); if (!rank) return;
  if (G.vehicleT <= 0) { G.vehicleCD -= dt; if (G.vehicleCD <= 0) {
    G.vehicleT = 8; G.vehicleCD = Math.max(12, 24-rank*2); G.vehicleFire = 0; sfx('drone'); } return; }
  G.vehicleT -= dt; G.vehicleFire -= dt;
  if (G.vehicleFire <= 0) { G.vehicleFire = Math.max(.45,.85-rank*.06); const b=bullets.alloc(); if(b){
    b.x=G.px+76;b.y=CFG.H-115;b.vx=0;b.vy=-500;b.dmg=8+rank*5;b.r=9;b.tier=3;b.aoe=55+rank*5; } }
}
let spawnAcc = 0;
function spawnWave(dt) {
  const lvl = G.level, li = lvl - 1;
  const endlessSpawn=G.mode==='endless'?Math.pow(1.09,G.loop):1;
  spawnAcc += BAL.spawnRate[li] * endlessSpawn * dt;
  while (spawnAcc >= 1) {
    spawnAcc--;
    const e = enemies.alloc(); if (!e) return;
    const roll = rng() * 100;
    const eliteRoll = rng();
    e.kind = lvl >= 6 && eliteRoll < 0.035 ? 4 : lvl >= 4 && eliteRoll < 0.095 ? 3
      : roll < BAL.mixCyb[li] ? 2 : (roll < BAL.mixCyb[li] + BAL.mixEld[li] ? 1 : 0);
    const K = EKIND[e.kind];
    e.x = e.kind === 4 ? G.px : rr(CFG.laneMargin, CFG.W - CFG.laneMargin);
    e.y = e.kind === 4 ? CFG.H - 185 : -30; e.baseX = e.x; e.phase = rr(0, 6.283); e.mode = e.kind === 4 ? 1 : 0;
    e.vx = rr(-18, 18); e.vy = K.spd + lvl * 7 + CFG.scrollSpd * 0.35;
    e.maxhp = e.hp = (e.kind < 3 ? [BAL.hp.bio, BAL.hp.eld, BAL.hp.cyb][e.kind](lvl)
      : (e.kind === 3 ? 30 + 7 * lvl : 45 + 10 * lvl));
    e.maxhp=e.hp*=G.mode==='endless'?Math.pow(1.12,G.loop):1;
    e.r = K.r; e.t = 0;
  }
}
function spawnBoss() {
  G.state = 'boss';
  const queen = G.level === CFG.levels, Q = BAL.queen;
  G.boss = { x: CFG.W/2, y: -140,
             hp: G.mode==='endless'?32000*Math.pow(1.15,G.loop):(queen ? Q.p1 + Q.p2 + Q.p3 : BAL.bossHp[G.level - 1]),
             maxhp: 0, phase: 0, t: 0, queen, eggT: 0 };
  G.boss.maxhp = G.boss.hp;
}
function damageEnemy(e, dmg, x, y) {
  e.hp -= dmg;
  dmgnum(x, y, Math.round(dmg));
  if (e.hp <= 0) {
    G.kills++;
    const K = EKIND[e.kind];
    G.credits += Math.round(K.credits*(G.mode==='endless'?Math.pow(1.10,G.loop):1));
    if (e.kind >= 3) sfx('elite');
    if (e.kind >= 3) G.hitStop = 0.04;
    gore(e.x, e.y, e.kind);
    if (e.kind === 2) aoe(e.x, e.y, 55, 6);           // cyber-mutant explodes
    if (rng() < 0.35) { const p = pickups.alloc(); if (p) { p.x = e.x; p.y = e.y; p.kind = rng() < 0.8 ? 0 : 1; } }
    enemies.release(e);
  }
}
function aoe(x, y, r, dmg) {
  fx(x, y, '#fa0');
  enemies.each(e => { const dx = e.x - x, dy = e.y - y; if (dx*dx + dy*dy < r*r) damageEnemy(e, dmg, e.x, e.y); });
}
function die() { G.state='dead';if(G.mode==='endless')G.meta.bestScore=Math.max(G.meta.bestScore||0,endlessScore());save(); }
function loseUnits(n, x, y) {
  G.squad -= Math.max(1, n - (G.perks['Shield Matrix'] || 0));
  G.squadFlash = 0.22; fx(x, y, '#48f');
  if (G.squad <= 0) die();
}

// ---------- fx ----------
function gore(x, y, kind) {
  const red = CFG.bloodColor === 'red' && kind !== 0;  // xenos (kind 0) always green
  for (let i = 0; i < 6; i++) {
    const s = splats.alloc(); if (!s) return;
    s.x = x; s.y = y; s.vx = rr(-90, 90); s.vy = rr(-140, 40); s.r = rr(2, 5); s.a = 1; s.red = red;
  }
  G.shake = Math.min(8, G.shake + 0.7);
}
function fx(x, y, col) { for (let i = 0; i < 10; i++) { const s = splats.alloc(); if (!s) return;
  s.x = x; s.y = y; s.vx = rr(-160,160); s.vy = rr(-160,160); s.r = rr(1.5,3.5); s.a = 1; s.red = false; s._col = col; } }
function dmgnum(x, y, v) { const d = dmgnums.alloc(); if (!d) return; d.x = x; d.y = y; d.v = 40; d.val = v; d.a = 1; }

// ---------- perks / shop ----------
let perkChoices = [];
function offerPerks() { G.state = 'perk';
  perkChoices = [];
  const owned = Object.keys(G.perks), cap = BAL.perks.baseKinds + Math.min(BAL.perks.maxExtraSlots, G.meta.perkSlot || 0);
  const pool = PERKS.filter(p => (G.perks[p] || 0) < BAL.perks.maxRank && (owned.length < cap || G.perks[p]));

// ---------- update ----------
let gateT = 0, last = 0;
function update(dt) {
  if (G.state !== 'play' && G.state !== 'boss') return;
  if (G.hitStop > 0) { G.hitStop -= dt; return; }
  if (G.bossKillT > 0) { G.bossKillT -= dt; dt *= .3; if (G.bossKillT <= 0) { G.boss=null; nextLevel(); return; } }
  G.t += dt; G.levelT += dt;
  G.maxSquad=Math.max(G.maxSquad,G.squad);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 12);
  if (G.flashT > 0) G.flashT -= dt;
  if (G.squadFlash > 0) G.squadFlash -= dt;

  if (testBot) {                                      // auto-play: chase best gate / dodge
    let tx = CFG.W / 2;
    let best = null;
    for (const g of gates) if (g.live && g.y > 200 && g.y < 800 && (g.kind !== 'add' || g.val > 0)) { best = g; break; }
    if (best) tx = best.x + best.w / 2;
    G.px += Math.sign(tx - G.px) * Math.min(Math.abs(tx - G.px), 320 * dt);
  }

  fire(dt);
  perkWeapons(dt);
  vehicleUpdate(dt);

  if (G.state === 'play') {
    spawnWave(dt);
    gateT -= dt; if (gateT <= 0) { spawnGatePair(); gateT = BAL.gates.interval(G.level); }
    if (G.levelT >= BAL.waveSec[G.level - 1]) spawnBoss();
  } else bossUpdate(dt);

  // bullets
  bullets.each(b => {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -20 || b.x < -20 || b.x > CFG.W + 20) { bullets.release(b); return; }
    for (const g of gates) if (g.live && b.x > g.x && b.x < g.x + g.w && b.y > g.y && b.y < g.y + g.h) {
      gateHit(g, b.dmg); bullets.release(b); return;
    }
    if (G.boss && !G.boss.dead && b.y < G.boss.y + 90 && Math.abs(b.x - G.boss.x) < 110) {
      G.boss.hp -= b.dmg; dmgnum(b.x, b.y, Math.round(b.dmg)); bullets.release(b);
      if (G.boss.hp <= 0) bossKill();
      return;
    }
  });
  // enemy grid-lite: brute segmented (fine at M0 counts)
  enemies.each(e => {
    e.t += dt;
    if (e.mode === 1) { if (e.t >= 0.8) { e.mode = 0; e.t = 0; sfx('elite'); } else return; }
    if (e.kind === 3) e.x = e.baseX + Math.sin(e.t * 5 + e.phase) * 78;
    else e.x += e.vx * dt;
    e.y += e.vy * dt;
    if (e.y > CFG.H + 40) { enemies.release(e); return; }
    // contact with squad zone
    if (e.y > CFG.H - 150 && Math.abs(e.x - G.px) < 60) {
      const loss = e.kind === 1 ? 6 : 2;

      return;
    }
    bullets.each(b => {
      const dx = e.x - b.x, dy = e.y - b.y, rr2 = (e.r + b.r) * (e.r + b.r);
      if (dx*dx + dy*dy < rr2) {

        if (b.aoe) aoe(e.x, e.y, b.aoe, b.dmg * .55);
        if (G.perks['Chain Lightning'] && rng() < 0.12 * G.perks['Chain Lightning']) aoe(e.x, e.y, 60, b.dmg);
        if (G.perks['Acid Rounds']) e.hp -= b.dmg * 0.2 * G.perks['Acid Rounds'];
      }
    });
  });
  // gates scroll
  for (const g of gates) { g.y += CFG.scrollSpd * dt;
    if (g.live && g.y + g.h > CFG.H - 150 && Math.abs((g.x + g.w/2) - G.px) < g.w/2 + 30) { g.live = false; gatePass(g); }
    }
  for (let i = gates.length - 1; i >= 0; i--) if (gates[i].y > CFG.H) gates.splice(i, 1);
  // pickups
  const magR = 60 + 40 * (G.perks['Magnet'] || 0);
  pickups.each(p => { p.y += CFG.scrollSpd * dt;
    const dx = p.x - G.px, dy = p.y - (CFG.H - 110);
    if (dx*dx + dy*dy < magR*magR) {

  splats.each(s => { s.x += s.vx * dt; s.y += s.vy * dt + CFG.scrollSpd * dt * 0.4; s.vy += 300 * dt;
    s.a -= dt * 1.4; if (s.a <= 0) splats.release(s); });
  dmgnums.each(d => { d.y -= d.v * dt; d.a -= dt * 1.2; if (d.a <= 0) dmgnums.release(d); });
}

function bossUpdate(dt) {
  const B = G.boss; if (!B) return;
  if (B.dead) return;
  B.t += dt;

  B.x = CFG.W/2 + Math.sin(B.t * 0.7) * (CFG.W/2 - 150);
  const hpFrac = B.hp / B.maxhp;

    cx.fillText(maxed ? `${it.name}${G.meta[it.k]}  —  MAX` : `${it.name}${G.meta[it.k]}  —  ₵${c}`, CFG.W / 2, y + 47);
  });
  cx.fillStyle = 'rgba(255,220,60,0.15)'; cx.fillRect(60, 840, CFG.W - 120, 70);
  cx.strokeStyle = '#fd4'; cx.strokeRect(60, 840, CFG.W - 120, 70);
  cx.fillStyle = '#ffd'; cx.font = 'bold 24px Segoe UI';
  cx.fillText('▶ DEPLOY — LEVEL ' + G.level, CFG.W / 2, 885);
}
function drawGear(){cx.fillStyle='#9cf';cx.font='26px Segoe UI';cx.textAlign='center';cx.fillText('⚙',CFG.W-34,42);
  cx.font='11px Segoe UI';cx.fillText(G.meta.sfx?'SFX':'MUTE',CFG.W-34,58);}
function drawTitle(){
  cx.textAlign='center';cx.fillStyle='#4ff';cx.shadowColor='#f4f';cx.shadowBlur=20;cx.font='bold 58px Segoe UI';cx.fillText('HiVE SWARM',CFG.W/2,300);cx.shadowBlur=0;
  cx.fillStyle='rgba(40,255,220,.16)';cx.fillRect(85,430,CFG.W-170,80);cx.strokeStyle='#4ff';cx.strokeRect(85,430,CFG.W-170,80);
  cx.fillStyle='#dff';cx.font='bold 24px Segoe UI';cx.fillText('CAMPAIGN',CFG.W/2,480);
  if(G.meta.endless){cx.fillStyle='rgba(255,80,220,.16)';cx.fillRect(85,620,CFG.W-170,80);cx.strokeStyle='#f4f';cx.strokeRect(85,620,CFG.W-170,80);
    cx.fillStyle='#fdf';cx.fillText('ENDLESS HIVE',CFG.W/2,670);cx.font='16px Segoe UI';cx.fillText('BEST '+(G.meta.bestScore||0),CFG.W/2,730);}
}
function drawEndScreen(win){const elapsed=Math.max(0,(performance.now()-G.runStart)/1000),score=endlessScore();
  cx.textAlign='center';cx.fillStyle=win?'#8f8':'#f66';cx.font='bold 48px Segoe UI';cx.fillText(win?'HIVE PURGED':'SWARM LOST',CFG.W/2,280);
  cx.fillStyle='#cdf';cx.font='20px Segoe UI';cx.fillText(`TIME ${elapsed.toFixed(1)}s  ·  KILLS ${G.kills}`,CFG.W/2,355);
  cx.fillText(`CREDITS ${Math.max(0,G.credits-G.creditsStart)}  ·  SCORE ${score}`,CFG.W/2,395);
  if(!win&&!G.reviveUsed){cx.fillStyle='rgba(80,180,255,.18)';cx.fillRect(90,620,CFG.W-180,90);cx.strokeStyle='#6df';cx.strokeRect(90,620,CFG.W-180,90);
    cx.fillStyle='#dff';cx.font='bold 22px Segoe UI';cx.fillText('WATCH AD TO REVIVE',CFG.W/2,675);}
  cx.font='16px Segoe UI';cx.fillStyle='#aaa';cx.fillText('tap elsewhere for title',CFG.W/2,790);
}
function screenText(big, small, col) {
  cx.fillStyle = col; cx.font = 'bold 52px Segoe UI'; cx.textAlign = 'center';
  cx.fillText(big, CFG.W / 2, CFG.H / 2 - 30);
  cx.fillStyle = '#aac'; cx.font = '22px Segoe UI';
  cx.fillText(small, CFG.W / 2, CFG.H / 2 + 30);
}

// ---------- loop ----------
function frame(ts) {
  const dt = Math.min(0.033, (ts - last) / 1000 || 0.016); last = ts;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (testBot) { G.state = 'title'; setTimeout(() => { if (testBot) startRun(); }, 600); }

// ---------- debug ----------
window.__dbg = () => ({ state: G.state, level: G.level, squad: G.squad, weapon: G.weapon,
  credits: G.credits, kills: G.kills, enemies: enemies.count(), bullets: bullets.count(),
  perks: Object.assign({}, G.perks), laserActive: G.laserT > 0,
  bossAttack: G.boss ? G.boss.attack||null : null, vehicleActive:G.vehicleT>0,
  mode:G.mode,loop:G.loop,score:endlessScore(),endlessUnlocked:!!G.meta.endless,bestScore:G.meta.bestScore||0,sfx:!!G.meta.sfx,
  boss: G.boss ? { hp: G.boss.hp, queen: G.boss.queen, phase: G.boss.phase } : null, testBot });
</script>
